<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>🕷️ Spidey·ML Ultimate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* --- RESET & BASE --- */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    .app {
      max-width: 600px;
      width: 100%;
      background: rgba(20,10,30,0.75);
      backdrop-filter: blur(14px);
      border-radius: 32px;
      padding: 1.2rem 1.2rem 1.8rem;
      border: 1px solid rgba(230,36,41,0.25);
      box-shadow: 0 0 60px rgba(230,36,41,0.1);
      position: relative;
      overflow: hidden;
    }

    /* --- HERO POSTER BANNER --- */
    .hero-banner {
      width: 100%;
      height: 180px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1rem;
      position: relative;
      border: 1px solid rgba(230, 36, 41, 0.4);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease;
    }
    .hero-banner:hover img {
      transform: scale(1.04);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(20,10,30,0.9) 0%, transparent 70%);
      display: flex;
      align-items: flex-end;
      padding: 1rem;
    }
    .hero-overlay span {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f8fafc;
      background: rgba(230, 36, 41, 0.85);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    /* --- ANIMATED SPIDER-MAN MOVEMENT --- */
    .spidey-mover {
      position: absolute;
      top: 20px;
      left: -80px;
      width: 70px;
      height: 70px;
      pointer-events: none;
      z-index: 10;
      animation: swingAndTraverse 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: drop-shadow(0 5px 12px rgba(230,36,41,0.6));
    }
    .spidey-mover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Thread hanging above Spidey */
    .spidey-mover::before {
      content: '';
      position: absolute;
      top: -150px;
      left: 50%;
      width: 1.5px;
      height: 150px;
      background: rgba(255,255,255,0.7);
    }

    @keyframes swingAndTraverse {
      0% {
        transform: translate(0, 0) rotate(-15deg);
        left: -80px;
      }
      25% {
        transform: translate(180px, 110px) rotate(20deg);
      }
      50% {
        transform: translate(360px, 20px) rotate(-10deg);
      }
      75% {
        transform: translate(480px, 130px) rotate(15deg);
      }
      100% {
        transform: translate(680px, 0px) rotate(-15deg);
        left: 100%;
      }
    }

    /* --- Web background pattern --- */
    .app::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(230,36,41,0.03) 0%, transparent 60%),
                  repeating-linear-gradient(45deg, rgba(230,36,41,0.02) 0px, rgba(230,36,41,0.02) 2px, transparent 2px, transparent 12px),
                  repeating-linear-gradient(-45deg, rgba(230,36,41,0.02) 0px, rgba(230,36,41,0.02) 2px, transparent 2px, transparent 12px);
      pointer-events: none;
      z-index: 0;
    }

    /* --- HEADER --- */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 2;
    }
    .logo { display: flex; align-items: center; gap: 0.5rem; }
    .logo i {
      font-size: 1.8rem;
      color: #e62429;
      filter: drop-shadow(0 0 12px rgba(230,36,41,0.4));
      animation: glow-pulse 2s infinite;
    }
    @keyframes glow-pulse {
      0% { filter: drop-shadow(0 0 5px rgba(230,36,41,0.2)); }
      50% { filter: drop-shadow(0 0 20px rgba(230,36,41,0.6)); }
      100% { filter: drop-shadow(0 0 5px rgba(230,36,41,0.2)); }
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(to right, #f8fafc, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo .badge {
      font-size: 0.5rem;
      background: #e62429;
      color: #fff;
      padding: 0.05rem 0.5rem;
      border-radius: 40px;
      -webkit-text-fill-color: #fff;
      font-weight: 700;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .streak-box, .level-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.15rem 0.7rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #fbbf24;
    }
    .level-box {
      background: #e62429;
      border-color: #e62429;
      color: #fff;
    }
    .progress-stats {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.1rem 0.7rem 0.1rem 0.8rem;
      border-radius: 100px;
    }
    .progress-stats span { font-size: 0.6rem; color: #9ca3af; }
    .progress-stats strong { color: #f8fafc; }
    .progress-bar-bg {
      width: 60px; height: 3px; background: #2a2a2a; border-radius: 4px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #e62429, #f97316);
      border-radius: 4px; transition: width 0.4s;
    }

    /* --- START BUTTON --- */
    .start-wrap {
      display: flex; justify-content: center; margin-bottom: 1.2rem; position: relative; z-index: 2;
    }
    .start-btn {
      background: linear-gradient(135deg, #e62429, #b91c1c);
      border: none; padding: 0.7rem 2rem; border-radius: 60px;
      font-size: 1rem; font-weight: 800; color: #fff;
      cursor: pointer; box-shadow: 0 0 30px rgba(230,36,41,0.3);
      transition: all 0.3s; display: flex; align-items: center; gap: 0.6rem;
      animation: web-pulse 2s infinite;
      width: 100%; justify-content: center;
    }
    .start-btn:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(230,36,41,0.5); }
    @keyframes web-pulse {
      0% { box-shadow: 0 0 15px rgba(230,36,41,0.2); }
      50% { box-shadow: 0 0 50px rgba(230,36,41,0.7), 0 0 80px rgba(230,36,41,0.3); }
      100% { box-shadow: 0 0 15px rgba(230,36,41,0.2); }
    }

    /* --- TODAY'S PICK --- */
    .today-highlight {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(230,36,41,0.3);
      border-radius: 16px; padding: 0.8rem 1rem; margin-bottom: 1.2rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.5rem; backdrop-filter: blur(8px); position: relative; z-index: 2;
    }
    .today-highlight .label { font-size: 0.6rem; color: #e62429; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .today-highlight .title { font-weight: 700; font-size: 0.9rem; color: #f8fafc; }
    .today-highlight .desc { color: #9ca3af; font-size: 0.7rem; }
    .today-highlight .link {
      background: #e62429; color: #fff; padding: 0.2rem 1rem; border-radius: 40px;
      text-decoration: none; font-weight: 700; font-size: 0.7rem;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 0.3rem;
      white-space: nowrap;
    }
    .today-highlight .link:hover { background: #f97316; }

    /* --- SEARCH --- */
    .search-box {
      display: flex; gap: 0.5rem; margin-bottom: 1rem; position: relative; z-index: 2;
    }
    .search-box input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px; padding: 0.4rem 1rem; color: #e8e8e8; font-size: 0.8rem;
      outline: none; transition: 0.2s;
    }
    .search-box input:focus { border-color: #e62429; }
    .search-box input::placeholder { color: #6b7280; }

    /* --- TABS --- */
    .tabs {
      display: flex; gap: 0.2rem; margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.3rem;
      flex-wrap: wrap; position: relative; z-index: 2;
    }
    .tab-btn {
      background: transparent; border: none; padding: 0.25rem 0.8rem;
      font-weight: 600; font-size: 0.65rem; color: #6b7280;
      border-radius: 40px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .tab-btn:hover { color: #e8e8e8; background: rgba(255,255,255,0.05); }
    .tab-btn.active { background: #e62429; color: #fff; box-shadow: 0 0 15px rgba(230,36,41,0.2); }

    .panel { display: none; animation: fadeUp 0.25s ease; }
    .panel.active { display: block; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

    /* --- CARDS --- */
    .grid-2 {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.7rem;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem 1rem;
      transition: all 0.25s; cursor: default;
      backdrop-filter: blur(4px);
    }
    .card:hover { border-color: rgba(230,36,41,0.4); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .card .badge-cat {
      font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0.05rem 0.5rem; border-radius: 40px; background: rgba(255,255,255,0.06);
      color: #9ca3af; display: inline-block; margin-bottom: 0.2rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card .title { font-weight: 700; font-size: 0.85rem; color: #f8fafc; margin-bottom: 0.1rem; }
    .card .desc { font-size: 0.7rem; color: #9ca3af; line-height: 1.3; margin-bottom: 0.4rem; }
    .card .resource-links {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.4rem;
    }
    .card .resource-links a {
      font-size: 0.6rem; color: #60a5fa; text-decoration: none;
      background: rgba(255,255,255,0.04); padding: 0.05rem 0.5rem; border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06); transition: 0.15s;
    }
    .card .resource-links a:hover { background: #e62429; color: #fff; border-color: #e62429; }
    .card .actions {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.4rem; margin-top: 0.1rem;
    }
    .card .actions .check-wrap {
      display: flex; align-items: center; gap: 0.3rem; font-size: 0.6rem; color: #9ca3af;
    }
    .card .actions .check-wrap input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: #e62429; cursor: pointer;
    }

    /* --- ROADMAP --- */
    .roadmap-container { display: flex; flex-direction: column; gap: 0.8rem; padding: 0.3rem 0; }
    .roadmap-row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .roadmap-node {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 0.6rem 1rem; flex: 1; min-width: 120px;
      text-align: center; transition: 0.2s;
    }
    .roadmap-node:hover { border-color: #e62429; }
    .roadmap-node .node-icon { font-size: 1.2rem; color: #e62429; }
    .roadmap-node .node-title { font-weight: 700; font-size: 0.7rem; color: #f8fafc; }
    .roadmap-node .node-desc { font-size: 0.55rem; color: #9ca3af; }
    .roadmap-arrow { color: #e62429; font-size: 0.8rem; opacity: 0.5; }

    /* --- STATS --- */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin: 0.5rem 0; }
    .stat-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem; text-align: center;
    }
    .stat-card .number { font-size: 1.6rem; font-weight: 900; color: #e62429; }
    .stat-card .label { font-size: 0.6rem; color: #9ca3af; margin-top: 0.1rem; }

    /* --- NOTEPAD --- */
    .notepad-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem; margin-top: 0.5rem;
    }
    .notepad-area textarea {
      width: 100%; background: transparent; border: none; color: #e8e8e8;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; resize: vertical;
      min-height: 100px; outline: none; padding: 0.2rem;
    }

    .footer {
      margin-top: 1.2rem; border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 0.6rem; display: flex; justify-content: space-between;
      flex-wrap: wrap; font-size: 0.55rem; color: #4b5563;
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <div class="spidey-mover">
    <img src="https://pngimg.com/uploads/spider_man/spider_man_PNG18.png" alt="Spider-Man Swinging">
  </div>

  <div class="hero-banner">
    <img src="spiderman-4k-artwork-hd-wallpaper-preview.jpg" alt="Spider-Man Artwork">
    <div class="hero-overlay">
      <span>🕸️ Spider-Senses Engaged</span>
    </div>
  </div>

  <header class="header">
    <div class="logo">
      <i class="fas fa-spider"></i>
      <h1>Spidey·ML</h1>
      <span class="badge">Ultimate</span>
    </div>
    <div class="header-actions">
      <div class="streak-box"><i class="fas fa-fire"></i> <span id="streakDisplay">1</span></div>
      <div class="level-box" id="levelBadge">🌱</div>
      <div class="progress-stats">
        <span><strong id="doneCount">0</strong>/<span id="totalCount">0</span></span>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="mainProgress"></div></div>
      </div>
    </div>
  </header>

  <div class="start-wrap">
    <button class="start-btn web-slinger" id="startBtn"><i class="fas fa-bolt"></i> Web Slinger – Start Today</button>
  </div>

  <div class="today-highlight" id="todayHighlight">
    <div>
      <div class="label"><i class="fas fa-star"></i> Daily Web Pick</div>
      <div class="title" id="todayTitle">Feature Engineering</div>
      <div class="desc" id="todayDesc">Turn raw data into model-ready features.</div>
    </div>
    <a href="https://www.geeksforgeeks.org/machine-learning/what-is-feature-engineering/" id="todayLink" class="link" target="_blank">Read <i class="fas fa-arrow-right"></i></a>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search topics, videos, datasets..." />
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-panel="topics"><i class="fas fa-graduation-cap"></i> Topics</button>
    <button class="tab-btn" data-panel="videos"><i class="fab fa-youtube"></i> Videos</button>
    <button class="tab-btn" data-panel="datasets"><i class="fas fa-database"></i> Datasets</button>
    <button class="tab-btn" data-panel="errors"><i class="fas fa-bug"></i> Errors</button>
    <button class="tab-btn" data-panel="roadmap"><i class="fas fa-map-signs"></i> Roadmap</button>
    <button class="tab-btn" data-panel="stats"><i class="fas fa-chart-pie"></i> Stats</button>
    <button class="tab-btn" data-panel="notepad"><i class="fas fa-pen"></i> Notes</button>
  </div>

  <div class="panel active" id="panel-topics"><div class="grid-2" id="topicsGrid"></div></div>
  <div class="panel" id="panel-videos"><div class="grid-2" id="videosGrid"></div></div>
  <div class="panel" id="panel-datasets"><div class="grid-2" id="datasetsGrid"></div></div>
  <div class="panel" id="panel-errors"><div class="grid-2" id="errorsGrid"></div></div>
  <div class="panel" id="panel-roadmap"><div class="roadmap-container" id="roadmapContainer"></div></div>
  <div class="panel" id="panel-stats"><div class="stats-grid" id="statsGrid"></div></div>
  <div class="panel" id="panel-notepad">
    <div class="notepad-area">
      <textarea id="notepadContent" placeholder="📝 Jot down notes, code snippets, questions..."></textarea>
    </div>
  </div>

  <div class="footer">
    <span><i class="fas fa-spider"></i> With great power comes great ML</span>
    <span><i class="fas fa-sync-alt"></i> Auto-saved</span>
  </div>
</div>

<script>
  // TOPICS
  const TOPICS = [
    { id: 't1', title: 'Feature Engineering', cat: 'Core', desc: 'Turn raw data into model-ready features.', resources: [{ label: 'GFG Guide', url: 'https://www.geeksforgeeks.org/machine-learning/what-is-feature-engineering/' }] },
    { id: 't2', title: 'Model Evaluation', cat: 'Core', desc: 'Know if your model actually works.', resources: [{ label: 'GFG Metrics', url: 'https://www.geeksforgeeks.org/machine-learning/metrics-for-machine-learning-model/' }] },
    { id: 't3', title: 'Deep Learning', cat: 'Advanced', desc: 'Neural networks for complex problems.', resources: [{ label: 'Learn PyTorch', url: 'https://www.learnpytorch.io/' }] },
    { id: 't4', title: 'NLP', cat: 'Advanced', desc: 'Make machines understand human text.', resources: [{ label: 'Hugging Face', url: 'https://huggingface.co/learn' }] }
  ];

  // VIDEOS
  const VIDEOS = [
    { id: 'v1', title: 'Python for Data Science', cat: 'Foundation', video: 'https://www.youtube.com/watch?v=LHBE6Q9XlzI', channel: 'freeCodeCamp' },
    { id: 'v2', title: 'Neural Networks Overview', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=aircAruvnKk', channel: '3Blue1Brown' }
  ];

  // DATASETS
  const DATASETS = [
    { id: 'd1', title: 'Titanic', cat: 'Tabular', desc: 'Classic survival prediction.' },
    { id: 'd2', title: 'MNIST', cat: 'Vision', desc: 'Handwritten digit recognition.' }
  ];

  // ERRORS
  const ERRORS = [
    { id: 'e1', title: 'KeyError: Column missing', desc: 'Column typo or wrong dataframe name.', fix: 'Print df.columns to check spelling.' },
    { id: 'e2', title: 'CUDA Out of Memory', desc: 'GPU ran out of RAM.', fix: 'Reduce batch size in training loop.' }
  ];

  // ROADMAP
  const ROADMAP = [
    { icon: 'fa-code', title: 'Python & SQL', desc: 'Data wrangling' },
    { icon: 'fa-chart-bar', title: 'Stats & EDA', desc: 'Explore & understand' },
    { icon: 'fa-robot', title: 'Classical ML', desc: 'Regression, Trees, XGBoost' },
    { icon: 'fa-brain', title: 'Deep Learning', desc: 'Neural Networks & Transformers' }
  ];

  // STATE MANAGEMENT
  let completed = JSON.parse(localStorage.getItem('spidey_completed') || '{}');

  function render() {
    // Render Topics
    document.getElementById('topicsGrid').innerHTML = TOPICS.map(t => `
      <div class="card">
        <span class="badge-cat">${t.cat}</span>
        <div class="title">${t.title}</div>
        <div class="desc">${t.desc}</div>
        <div class="resource-links">${t.resources.map(r => `<a href="${r.url}" target="_blank">${r.label}</a>`).join('')}</div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${completed[t.id] ? 'checked' : ''} onchange="toggleDone('${t.id}')"> Done
          </label>
        </div>
      </div>
    `).join('');

    // Render Videos
    document.getElementById('videosGrid').innerHTML = VIDEOS.map(v => `
      <div class="card">
        <span class="badge-cat">${v.cat}</span>
        <div class="title">${v.title}</div>
        <div class="desc">Channel: ${v.channel}</div>
        <div class="resource-links"><a href="${v.video}" target="_blank">Watch Video</a></div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${completed[v.id] ? 'checked' : ''} onchange="toggleDone('${v.id}')"> Watched
          </label>
        </div>
      </div>
    `).join('');

    // Render Datasets
    document.getElementById('datasetsGrid').innerHTML = DATASETS.map(d => `
      <div class="card">
        <span class="badge-cat">${d.cat}</span>
        <div class="title">${d.title}</div>
        <div class="desc">${d.desc}</div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${completed[d.id] ? 'checked' : ''} onchange="toggleDone('${d.id}')"> Explored
          </label>
        </div>
      </div>
    `).join('');

    // Render Errors
    document.getElementById('errorsGrid').innerHTML = ERRORS.map(e => `
      <div class="card">
        <div class="title">${e.title}</div>
        <div class="desc">${e.desc}</div>
        <div class="desc" style="color: #e62429;"><strong>Fix:</strong> ${e.fix}</div>
      </div>
    `).join('');

    // Render Roadmap
    document.getElementById('roadmapContainer').innerHTML = ROADMAP.map(r => `
      <div class="roadmap-row">
        <div class="roadmap-node">
          <i class="fas ${r.icon} node-icon"></i>
          <div class="node-title">${r.title}</div>
          <div class="node-desc">${r.desc}</div>
        </div>
      </div>
    `).join('');

    // Render Stats
    const totalItems = TOPICS.length + VIDEOS.length + DATASETS.length;
    const doneCount = Object.keys(completed).filter(k => completed[k]).length;
    document.getElementById('doneCount').innerText = doneCount;
    document.getElementById('totalCount').innerText = totalItems;
    document.getElementById('mainProgress').style.width = `${(doneCount / totalItems) * 100}%`;

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="number">${doneCount}</div><div class="label">Completed</div></div>
      <div class="stat-card"><div class="number">${totalItems - doneCount}</div><div class="label">Remaining</div></div>
      <div class="stat-card"><div class="number">${Math.round((doneCount / totalItems) * 100)}%</div><div class="label">Progress</div></div>
    `;
  }

  function toggleDone(id) {
    completed[id] = !completed[id];
    localStorage.setItem('spidey_completed', JSON.stringify(completed));
    render();
  }

  // TAB SWITCHING
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${btn.dataset.panel}`).classList.add('active');
    });
  });

  // INITIALIZE APP
  render();
</script>
</body>
</html>
