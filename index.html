<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>AI/DS Learning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #e8edf5;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 8px;
        }

        .app {
            max-width: 1280px;
            width: 100%;
            background: #131e2f;
            border-radius: 32px;
            padding: 1.8rem 2rem 2.5rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-area i {
            font-size: 2rem;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .daily-btn {
            background: rgba(79, 70, 229, 0.15);
            border: 1px solid rgba(79, 70, 229, 0.3);
            color: #a5b4fc;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .daily-btn:hover {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }
        .progress-stats {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: #1e293b;
            padding: 0.3rem 1.2rem 0.3rem 1.5rem;
            border-radius: 100px;
        }
        .progress-stats span {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .progress-stats strong {
            color: #e2e8f0;
        }
        .progress-bar-bg {
            width: 100px;
            height: 6px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #4f46e5);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.5rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.6rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #64748b;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .tab-btn:hover {
            color: #e2e8f0;
            background: #1e293b;
        }
        .tab-btn.active {
            background: #4f46e5;
            color: #fff;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }

        /* Panels */
        .panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Filters */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
        }
        .filter-btn {
            background: #1e293b;
            border: 1px solid transparent;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.15s;
        }
        .filter-btn:hover {
            border-color: #4f46e5;
            color: #e2e8f0;
        }
        .filter-btn.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }

        /* Grids */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        /* Cards */
        .card {
            background: #1a2639;
            border: 1px solid #273548;
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: default;
            position: relative;
        }
        .card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        .card .badge-cat {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            background: #273548;
            color: #94a3b8;
            display: inline-block;
            margin-bottom: 0.6rem;
        }
        .card .title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .card .desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .card .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .card .links a {
            font-size: 0.7rem;
            font-weight: 600;
            text-decoration: none;
            background: #273548;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.1s;
        }
        .card .links a i {
            color: #818cf8;
        }
        .card .links a:hover {
            background: #334155;
            color: #fff;
        }
        .card .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #273548;
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }
        .card .actions .check-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .card .actions .check-wrap input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4f46e5;
            cursor: pointer;
        }
        .card .actions .detail-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .card .actions .detail-btn:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
        }

        /* Daily Dose Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1a2639;
            border: 1px solid #334155;
            border-radius: 32px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.25s ease;
            position: relative;
        }
        .modal-box .close-modal {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .modal-box .close-modal:hover {
            color: #fff;
        }
        .modal-box h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-box .modal-sub {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .modal-box .modal-body p {
            background: #0f172a;
            padding: 1.2rem;
            border-radius: 16px;
            border-left: 4px solid #4f46e5;
            line-height: 1.7;
            color: #e2e8f0;
            font-size: 0.95rem;
        }
        .modal-box .modal-body .tag {
            display: inline-block;
            background: #4f46e5;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 1rem;
            color: #fff;
        }

        /* Project Deep Dive (inside card or modal) - we'll use a detail modal */
        .project-steps-list {
            margin-top: 0.8rem;
        }
        .project-steps-list li {
            list-style: none;
            font-size: 0.8rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            display: flex;
            gap: 0.8rem;
            align-items: baseline;
        }
        .project-steps-list li i {
            color: #818cf8;
            width: 16px;
            font-size: 0.7rem;
            margin-top: 0.2rem;
        }

        /* Footer */
        .footer {
            margin-top: 2.5rem;
            border-top: 1px solid #1e293b;
            padding-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #475569;
        }
        .footer a {
            color: #818cf8;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .app {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .progress-stats {
                justify-content: space-between;
                width: 100%;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            .tab-btn {
                white-space: nowrap;
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="logo-area">
                <i class="fas fa-microchip"></i>
                <h1>DS·ML Engine</h1>
            </div>
            <div class="header-actions">
                <button class="daily-btn" id="dailyDoseBtn"><i class="fas fa-dice-d6"></i> Daily Dose</button>
                <div class="progress-stats">
                    <span><strong id="doneCount">0</strong> / <span id="totalCount">0</span></span>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="mainProgress"></div></div>
                </div>
            </div>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" data-panel="theory"><i class="fas fa-graduation-cap"></i> Curriculum</button>
            <button class="tab-btn" data-panel="projects"><i class="fas fa-database"></i> Datasets</button>
        </div>

        <!-- PANEL: THEORY -->
        <div class="panel active" id="panel-theory">
            <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:1.5rem;">
                <span style="background:#1e293b; padding:0.2rem 1.2rem; border-radius:40px; font-size:0.7rem; font-weight:600;"><i class="fas fa-layer-group"></i> Foundation</span>
                <span style="background:#1e293b; padding:0.2rem 1.2rem; border-radius:40px; font-size:0.7rem; font-weight:600;"><i class="fas fa-cogs"></i> Core</span>
                <span style="background:#1e293b; padding:0.2rem 1.2rem; border-radius:40px; font-size:0.7rem; font-weight:600;"><i class="fas fa-rocket"></i> Advanced</span>
            </div>
            <div class="grid-2" id="theoryGrid"></div>
        </div>

        <!-- PANEL: PROJECTS -->
        <div class="panel" id="panel-projects">
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="tabular">Tabular</button>
                <button class="filter-btn" data-filter="vision">Vision</button>
                <button class="filter-btn" data-filter="nlp">NLP</button>
                <button class="filter-btn" data-filter="timeseries">Time Series</button>
                <button class="filter-btn" data-filter="other">Other</button>
            </div>
            <div class="grid-2" id="projectGrid"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span><i class="far fa-calendar-alt"></i> Built for Yashit · PIET CSE'28</span>
            <span><i class="fas fa-sync-alt"></i> Progress auto-saved</span>
        </div>
    </div>

    <!-- DAILY DOSE MODAL -->
    <div class="modal-overlay" id="dailyModal">
        <div class="modal-box">
            <button class="close-modal" id="closeDailyModal">&times;</button>
            <h2><i class="fas fa-dice-d6"></i> Daily Dose</h2>
            <div class="modal-sub">Random concept to sharpen your edge.</div>
            <div class="modal-body" id="dailyBody">
                <p>Loading...</p>
                <span class="tag">#random</span>
            </div>
        </div>
    </div>

    <!-- PROJECT DETAIL MODAL -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal-box">
            <button class="close-modal" id="closeProjectModal">&times;</button>
            <h2 id="projectModalTitle">Project Name</h2>
            <div class="modal-sub" id="projectModalDesc">Description</div>
            <div class="modal-body">
                <div style="font-weight:600; font-size:0.8rem; color:#94a3b8; margin-bottom:0.5rem;"><i class="fas fa-list-check"></i> Full ML Pipeline</div>
                <ul class="project-steps-list" id="projectModalSteps"></ul>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA
        // ============================================================
        const THEORY_DATA = [{

        }, {
            id: 'p13',
            title: 'Air Quality',
            cat: 'timeseries',
            desc: 'PM2.5 pollutant forecasting.',
            steps: [
                '1. Impute missing values using interpolation.',
                '2. Multivariate LSTM (use weather data).',
                '3. Evaluate using RMSE and MAE.'
            ]
        }, {
            id: 'p14',
            title: 'Credit Card Fraud',
            cat: 'other',
            desc: 'Highly imbalanced fraud detection.',
            steps: [
                '1. Handle class imbalance (SMOTE, ADASYN).',
                '2. Train Random Forest and XGBoost.',
                '3. Focus on Precision-Recall AUC.'
            ]
        }, {
            id: 'p15',
            title: 'Customer Segmentation',
            cat: 'other',
            desc: 'Unsupervised customer clustering.',
            steps: [
                '1. Scale features using StandardScaler.',
                '2. K-means with Elbow & Silhouette analysis.',
                '3. Visualize clusters with PCA.'
            ]
        }, {
            id: 'p16',
            title: 'California Housing',
            cat: 'tabular',
            desc: 'Median house value prediction.',
            steps: [
                '1. Geospatial EDA (latitude/longitude plots).',
                '2. Train XGBoost with Hyperopt tuning.',
                '3. Interpret model using SHAP values.'
            ]
        }, {
            id: 'p17',
            title: 'Forest Cover Type',
            cat: 'tabular',
            desc: 'Multiclass cartographic classification.',
            steps: [
                '1. Feature scaling (MinMax).',
                '2. Random Forest with class_weight.',
                '3. Compute class-wise F1-score.'
            ]
        }, {
            id: 'p18',
            title: 'Human Activity Recognition',
            cat: 'timeseries',
            desc: 'Sensor data (accelerometer).',
            steps: [
                '1. Extract time-domain features (mean, std).',
                '2. Build 1D-CNN and LSTM.',
                '3. Compare confusion matrices.'
            ]
        }, {
            id: 'p19',
            title: 'COCO (subset)',
            cat: 'vision',
            desc: 'Object detection / segmentation.',
            steps: [
                '1. Use YOLOv8 or Detectron2.',
                '2. Train on a subset (person, car, etc.).',
                '3. Evaluate using mAP and visualize bounding boxes.'
            ]
        }, {
            id: 'p20',
            title: 'KITTI',
            cat: 'vision',
            desc: 'Autonomous driving (LiDAR/stereo).',
            steps: [
                '1. Explore 3D point cloud data.',
                '2. Implement PointNet or similar.',
                '3. Understand sensor fusion concepts.'
            ]
        }];

        // Daily dose phrases
        const DAILY_DOSES = [
            { concept: "Bias-Variance Tradeoff", desc: "High bias (underfitting) vs High variance (overfitting). Use cross-validation and regularization to find the sweet spot." },
            { concept: "Gradient Descent", desc: "Optimization algorithm to minimize loss. Variants: Batch, Stochastic (SGD), Mini-batch. Learning rate is key." },
            { concept: "Attention is All You Need", desc: "Transformers use self-attention to weigh input tokens. No RNNs. Parallelizable and state-of-the-art for NLP." },
            { concept: "Confusion Matrix", desc: "A table to evaluate classification. TN, FP, FN, TP. Derives metrics: Precision, Recall, F1, Accuracy." },
            { concept: "Principal Component Analysis (PCA)", desc: "Unsupervised dimensionality reduction. Finds orthogonal axes of maximum variance." },
            { concept: "Regularization (L1/L2)", desc: "L1 (Lasso) yields sparse features. L2 (Ridge) shrinks weights evenly. Prevents overfitting." },
            { concept: "Cross-Validation", desc: "K-Fold CV splits data into K folds. Trains K times, each on K-1 folds, validates on the held-out fold. Reduces variance." },
            { concept: "Feature Engineering", desc: "Creating new features from raw data. Log transforms, polynomial features, domain-specific interactions." },
            { concept: "LLM Fine-Tuning", desc: "Adapting pre-trained models (like Llama, GPT) to specific tasks using instruction tuning or PEFT (LoRA)." },
            { concept: "MLOps Lifecycle", desc: "Data versioning, model registry, CI/CD, monitoring (drift detection), and retraining pipelines." }
        ];

        // ============================================================
        // STATE MANAGEMENT
        // ============================================================
        function getChecked(prefix) {
            try { return JSON.parse(localStorage.getItem('mlhub_' + prefix)) || []; } catch (e) { return []; }
        }

        function setChecked(prefix, arr) {
            localStorage.setItem('mlhub_' + prefix, JSON.stringify(arr));
        }

        function toggleCheck(prefix, id) {
            let arr = getChecked(prefix);
            if (arr.includes(id)) arr = arr.filter(x => x !== id);
            else arr.push(id);
            setChecked(prefix, arr);
            return arr;
        }

        function isChecked(prefix, id) {
            return getChecked(prefix).includes(id);
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================
        const theoryGrid = document.getElementById('theoryGrid');
        const projectGrid = document.getElementById('projectGrid');

        function renderTheory() {
            theoryGrid.innerHTML = THEORY_DATA.map(item => `
                    <div class="card" data-id="${item.id}">
                        <div class="badge-cat">${item.cat}</div>
                        <div class="title">${item.title}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="links">
                            ${item.links.map(l => `<a href="${l.url}" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> ${l.label}</a>`).join('')}
                        </div>
                        <div class="actions">
                            <div class="check-wrap">
                                <input type="checkbox" class="theory-cb" data-id="${item.id}" ${isChecked('theory', item.id) ? 'checked' : ''} />
                                <span>Completed</span>
                            </div>
                        </div>
                    </div>
                `).join('');

            document.querySelectorAll('.theory-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    toggleCheck('theory', this.dataset.id);
                    updateProgress();
                });
            });
        }

        function renderProjects(filter = 'all') {
            const filtered = filter === 'all' ? PROJECT_DATA : PROJECT_DATA.filter(p => p.cat === filter);
            projectGrid.innerHTML = filtered.map(item => `
                    <div class="card" data-id="${item.id}" data-cat="${item.cat}">
                        <div class="badge-cat">${item.cat}</div>
                        <div class="title">${item.title}</div>
                        <div class="desc">${item.desc}</div>
                        <div class="actions">
                            <div class="check-wrap">
                                <input type="checkbox" class="project-cb" data-id="${item.id}" ${isChecked('project', item.id) ? 'checked' : ''} />
                                <span>Done</span>
                            </div>
                            <button class="detail-btn" data-id="${item.id}"><i class="fas fa-chevron-circle-right"></i> Pipeline</button>
                        </div>
                    </div>
                `).join('');

            document.querySelectorAll('.project-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    toggleCheck('project', this.dataset.id);
                    updateProgress();
                });
            });

            document.querySelectorAll('.detail-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const project = PROJECT_DATA.find(p => p.id === id);
                    if (project) openProjectModal(project);
                });
            });
        }

        function updateProgress() {
            const theoryDone = getChecked('theory').length;
            const projDone = getChecked('project').length;
            const total = THEORY_DATA.length + PROJECT_DATA.length;
            const done = theoryDone + projDone;
            document.getElementById('doneCount').textContent = done;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('mainProgress').style.width = (done / total * 100) + '%';
        }

        // ============================================================
        // MODALS
        // ============================================================
        const dailyModal = document.getElementById('dailyModal');
        const projectModal = document.getElementById('projectModal');

        document.getElementById('dailyDoseBtn').addEventListener('click', () => {
            const dose = DAILY_DOSES[Math.floor(Math.random() * DAILY_DOSES.length)];
            document.getElementById('dailyBody').innerHTML = `
                    <p><strong>${dose.concept}</strong><br><br>${dose.desc}</p>
                    <span class="tag"><i class="fas fa-lightbulb"></i> Today's Insight</span>
                `;
            dailyModal.classList.add('open');
        });

        document.getElementById('closeDailyModal').addEventListener('click', () => dailyModal.classList.remove('open'));
        document.getElementById('closeProjectModal').addEventListener('click', () => projectModal.classList.remove('open'));

        dailyModal.addEventListener('click', (e) => {
            if (e.target === dailyModal) dailyModal.classList.remove('open');
        });
        projectModal.addEventListener('click', (e) => {
            if (e.target === projectModal) projectModal.classList.remove('open');
        });

        function openProjectModal(project) {
            document.getElementById('projectModalTitle').textContent = project.title;
            document.getElementById('projectModalDesc').textContent = project.desc;
            document.getElementById('projectModalSteps').innerHTML = project.steps.map(s =>
                `<li><i class="fas fa-check-circle"></i> ${s.replace(/^\d+\.\s*/, '')}</li>`
            ).join('');
            projectModal.classList.add('open');
        }

        // ============================================================
        // FILTERS & TABS
        // ============================================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderProjects(this.dataset.filter);
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + this.dataset.panel).classList.add('active');
            });
        });

        // ============================================================
        // BOOT
        // ============================================================
        renderTheory();
        renderProjects('all');
        updateProgress();
    </script>

</body>
</html>
