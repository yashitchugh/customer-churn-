<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>🕷️ Spidey·ML</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }
    .app {
      max-width: 600px;
      width: 100%;
      background: rgba(20,10,30,0.6);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 1.2rem 1.2rem 1.8rem;
      border: 1px solid rgba(230,36,41,0.25);
      box-shadow: 0 0 60px rgba(230,36,41,0.05);
      position: relative;
      overflow: hidden;
    }
    /* Web background pattern */
    .app::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(230,36,41,0.03) 0%, transparent 60%),
                  repeating-linear-gradient(45deg, rgba(230,36,41,0.02) 0px, rgba(230,36,41,0.02) 2px, transparent 2px, transparent 10px);
      pointer-events: none;
      z-index: 0;
    }
    /* Animated spider */
    .spider-float {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 2.2rem;
      color: #e62429;
      animation: swing 4s ease-in-out infinite;
      z-index: 1;
      opacity: 0.7;
      filter: drop-shadow(0 0 10px rgba(230,36,41,0.3));
    }
    @keyframes swing {
      0% { transform: rotate(-10deg) translateY(0); }
      50% { transform: rotate(10deg) translateY(-8px); }
      100% { transform: rotate(-10deg) translateY(0); }
    }
    /* Web lines (CSS only) */
    .web-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 80% 20%, rgba(230,36,41,0.05) 0%, transparent 50%);
    }
    .web-lines::after {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: repeating-linear-gradient(45deg, rgba(230,36,41,0.02) 0px, rgba(230,36,41,0.02) 1px, transparent 1px, transparent 8px);
      transform: rotate(10deg);
    }

    /* ----- HEADER ----- */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 2;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo i {
      font-size: 1.8rem;
      color: #e62429;
      filter: drop-shadow(0 0 12px rgba(230,36,41,0.4));
      animation: pulse-glow 2s infinite;
    }
    @keyframes pulse-glow {
      0% { filter: drop-shadow(0 0 8px rgba(230,36,41,0.2)); }
      50% { filter: drop-shadow(0 0 20px rgba(230,36,41,0.6)); }
      100% { filter: drop-shadow(0 0 8px rgba(230,36,41,0.2)); }
    }
    .logo h1 {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(to right, #f8fafc, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo .badge {
      font-size: 0.5rem;
      background: #e62429;
      color: #fff;
      padding: 0.05rem 0.5rem;
      border-radius: 40px;
      -webkit-text-fill-color: #fff;
      font-weight: 700;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .streak-box, .level-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.15rem 0.7rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #fbbf24;
    }
    .level-box {
      background: #e62429;
      border-color: #e62429;
      color: #fff;
    }
    .progress-stats {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.1rem 0.7rem 0.1rem 0.8rem;
      border-radius: 100px;
    }
    .progress-stats span { font-size: 0.6rem; color: #9ca3af; }
    .progress-stats strong { color: #f8fafc; }
    .progress-bar-bg {
      width: 60px; height: 3px; background: #2a2a2a; border-radius: 4px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #e62429, #f97316);
      border-radius: 4px; transition: width 0.4s;
    }

    /* ----- START BUTTON (Web Slinger) ----- */
    .start-wrap {
      display: flex; justify-content: center; margin-bottom: 1.2rem; position: relative; z-index: 2;
    }
    .start-btn {
      background: linear-gradient(135deg, #e62429, #b91c1c);
      border: none; padding: 0.7rem 2rem; border-radius: 60px;
      font-size: 1rem; font-weight: 800; color: #fff;
      cursor: pointer; box-shadow: 0 0 30px rgba(230,36,41,0.3);
      transition: all 0.3s; display: flex; align-items: center; gap: 0.6rem;
      animation: web-pulse 2s infinite;
      width: 100%; justify-content: center;
    }
    .start-btn:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(230,36,41,0.5); }
    @keyframes web-pulse {
      0% { box-shadow: 0 0 15px rgba(230,36,41,0.2); }
      50% { box-shadow: 0 0 40px rgba(230,36,41,0.6); }
      100% { box-shadow: 0 0 15px rgba(230,36,41,0.2); }
    }

    /* ----- TODAY'S PICK (Daily Web) ----- */
    .today-highlight {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(230,36,41,0.3);
      border-radius: 16px; padding: 0.8rem 1rem; margin-bottom: 1.2rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.5rem; backdrop-filter: blur(8px); position: relative; z-index: 2;
    }
    .today-highlight .label { font-size: 0.6rem; color: #e62429; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .today-highlight .title { font-weight: 700; font-size: 0.9rem; color: #f8fafc; }
    .today-highlight .desc { color: #9ca3af; font-size: 0.7rem; }
    .today-highlight .link {
      background: #e62429; color: #fff; padding: 0.2rem 1rem; border-radius: 40px;
      text-decoration: none; font-weight: 700; font-size: 0.7rem;
      transition: 0.2s; display: inline-flex; align-items: center; gap: 0.3rem;
      white-space: nowrap;
    }
    .today-highlight .link:hover { background: #f97316; }

    /* ----- SEARCH ----- */
    .search-box {
      display: flex; gap: 0.5rem; margin-bottom: 1rem; position: relative; z-index: 2;
    }
    .search-box input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px; padding: 0.4rem 1rem; color: #e8e8e8; font-size: 0.8rem;
      outline: none; transition: 0.2s;
    }
    .search-box input:focus { border-color: #e62429; }
    .search-box input::placeholder { color: #6b7280; }

    /* ----- TABS ----- */
    .tabs {
      display: flex; gap: 0.2rem; margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.3rem;
      flex-wrap: wrap; position: relative; z-index: 2;
    }
    .tab-btn {
      background: transparent; border: none; padding: 0.25rem 0.8rem;
      font-weight: 600; font-size: 0.65rem; color: #6b7280;
      border-radius: 40px; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .tab-btn:hover { color: #e8e8e8; background: rgba(255,255,255,0.05); }
    .tab-btn.active { background: #e62429; color: #fff; box-shadow: 0 0 15px rgba(230,36,41,0.2); }
    .tab-btn.active i { color: #fff; }

    .panel { display: none; animation: fadeUp 0.25s ease; }
    .panel.active { display: block; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

    /* ----- CARDS (glass) ----- */
    .grid-2 {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.7rem;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem 1rem;
      transition: all 0.25s; cursor: default;
      backdrop-filter: blur(4px);
    }
    .card:hover { border-color: rgba(230,36,41,0.4); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .card .badge-cat {
      font-size: 0.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0.05rem 0.5rem; border-radius: 40px; background: rgba(255,255,255,0.06);
      color: #9ca3af; display: inline-block; margin-bottom: 0.2rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card .badge-cat.red { background: rgba(230,36,41,0.15); color: #ef4444; border-color: rgba(230,36,41,0.2); }
    .card .title { font-weight: 700; font-size: 0.85rem; color: #f8fafc; margin-bottom: 0.1rem; }
    .card .desc { font-size: 0.7rem; color: #9ca3af; line-height: 1.3; margin-bottom: 0.4rem; }
    .card .resource-links {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.4rem;
    }
    .card .resource-links a {
      font-size: 0.6rem; color: #60a5fa; text-decoration: none;
      background: rgba(255,255,255,0.04); padding: 0.05rem 0.5rem; border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: 0.15s;
    }
    .card .resource-links a:hover { background: #e62429; color: #fff; border-color: #e62429; }
    .card .actions {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.4rem; margin-top: 0.1rem;
    }
    .card .actions .check-wrap {
      display: flex; align-items: center; gap: 0.3rem; font-size: 0.6rem; color: #9ca3af;
    }
    .card .actions .check-wrap input[type="checkbox"] {
      width: 14px; height: 14px; accent-color: #e62429; cursor: pointer;
    }

    /* ----- STATS ----- */
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin: 0.5rem 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem; text-align: center;
    }
    .stat-card .number { font-size: 1.6rem; font-weight: 900; color: #e62429; }
    .stat-card .label { font-size: 0.6rem; color: #9ca3af; margin-top: 0.1rem; }

    /* ----- NOTEPAD ----- */
    .notepad-area {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 0.8rem; margin-top: 0.5rem;
    }
    .notepad-area textarea {
      width: 100%; background: transparent; border: none; color: #e8e8e8;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; resize: vertical;
      min-height: 100px; outline: none; padding: 0.2rem;
    }
    .notepad-area textarea::placeholder { color: #6b7280; }

    /* ----- ROADMAP (mini) ----- */
    .roadmap-mini {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0;
    }
    .roadmap-mini .item {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px; padding: 0.15rem 0.7rem; font-size: 0.6rem;
      color: #9ca3af; display: flex; align-items: center; gap: 0.3rem;
    }
    .roadmap-mini .item i { color: #e62429; }

    /* ----- CONFETTI ----- */
    .confetti-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; width: 6px; height: 6px; border-radius: 2px;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    .footer {
      margin-top: 1.2rem; border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 0.6rem; display: flex; justify-content: space-between;
      flex-wrap: wrap; font-size: 0.55rem; color: #4b5563;
    }

    @media (max-width: 450px) {
      .app { padding: 0.8rem; }
      .header { gap: 0.4rem; }
      .logo h1 { font-size: 1.1rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .start-btn { font-size: 0.9rem; padding: 0.6rem 1.2rem; }
      .tabs { gap: 0.1rem; }
      .tab-btn { padding: 0.2rem 0.6rem; font-size: 0.6rem; }
      .today-highlight { flex-direction: column; align-items: stretch; }
      .today-highlight .link { text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Animated Spider -->
  <div class="spider-float"><i class="fas fa-spider"></i></div>
  <div class="web-lines"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <i class="fas fa-spider"></i>
      <h1>Spidey·ML</h1>
      <span class="badge">v2</span>
    </div>
    <div class="header-actions">
      <div class="streak-box"><i class="fas fa-fire"></i> <span id="streakDisplay">0</span></div>
      <div class="level-box" id="levelBadge">🌱</div>
      <div class="progress-stats">
        <span><strong id="doneCount">0</strong>/<span id="totalCount">0</span></span>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="mainProgress"></div></div>
      </div>
    </div>
  </header>

  <!-- START BUTTON (Web Slinger) -->
  <div class="start-wrap">
    <button class="start-btn" id="startBtn"><i class="fas fa-bolt"></i> Web Slinger – Start Today</button>
  </div>

  <!-- TODAY'S PICK -->
  <div class="today-highlight" id="todayHighlight">
    <div>
      <div class="label"><i class="fas fa-star"></i> Daily Web Pick</div>
      <div class="title" id="todayTitle">Loading...</div>
      <div class="desc" id="todayDesc">Tap the button to get a resource</div>
    </div>
    <a href="#" id="todayLink" class="link" target="_blank">Read <i class="fas fa-arrow-right"></i></a>
  </div>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search topics, resources..." />
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-panel="topics"><i class="fas fa-graduation-cap"></i> Topics</button>
    <button class="tab-btn" data-panel="resources"><i class="fas fa-link"></i> All Links</button>
    <button class="tab-btn" data-panel="stats"><i class="fas fa-chart-pie"></i> Stats</button>
    <button class="tab-btn" data-panel="notepad"><i class="fas fa-pen"></i> Notes</button>
  </div>

  <!-- PANELS -->
  <div class="panel active" id="panel-topics"><div class="grid-2" id="topicsGrid"></div></div>
  <div class="panel" id="panel-resources"><div class="grid-2" id="resourcesGrid"></div></div>
  <div class="panel" id="panel-stats">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="roadmap-mini" id="roadmapMini"></div>
  </div>
  <div class="panel" id="panel-notepad">
    <div class="notepad-area">
      <textarea id="notepadContent" placeholder="📝 Jot down your thoughts, code snippets, or questions..."></textarea>
    </div>
  </div>

  <div class="footer">
    <span><i class="fas fa-spider"></i> With great power comes great ML</span>
    <span><i class="fas fa-sync-alt"></i> Auto-saved</span>
  </div>
</div>

<!-- CONFETTI -->
<div class="confetti-container" id="confettiBox"></div>

<script>
  // ============================================================
  //  DATA – All resources from the reading list
  // ============================================================
  const TOPICS = [
    {
      id: 't1',
      title: 'Feature Engineering',
      cat: 'Core',
      desc: 'Turn raw data into model-ready features.',
      resources: [
        { label: 'GFG – What is FE?', url: 'https://www.geeksforgeeks.org/machine-learning/what-is-feature-engineering/' },
        { label: 'TDS – Techniques', url: 'https://towardsdatascience.com/feature-engineering-techniques-bab6cb39ed7e/' },
        { label: 'Kaggle Video', url: 'https://www.youtube.com/watch?v=0Wgt6ofPbOc' }
      ]
    },
    {
      id: 't2',
      title: 'Model Evaluation',
      cat: 'Core',
      desc: 'Know if your model actually works.',
      resources: [
        { label: 'GFG – Evaluation', url: 'https://www.geeksforgeeks.org/machine-learning/machine-learning-model-evaluation/' },
        { label: 'GFG – Metrics', url: 'https://www.geeksforgeeks.org/machine-learning/metrics-for-machine-learning-model/' },
        { label: 'GFG – Model Selection', url: 'https://www.geeksforgeeks.org/machine-learning/model-selection-for-machine-learning/' },
        { label: 'Quiz – Test Yourself', url: 'https://www.geeksforgeeks.org/quizzes/model-evaluation-Techniques-in-machine-learning/' }
      ]
    },
    {
      id: 't3',
      title: 'Deep Learning',
      cat: 'Advanced',
      desc: 'Neural networks for real-world problems.',
      resources: [
        { label: 'GFG – DL Tutorial', url: 'https://www.geeksforgeeks.org/deep-learning/deep-learning-tutorial/' },
        { label: 'GFG – DL Projects', url: 'https://www.geeksforgeeks.org/deep-learning/deep-learning-projects-with-source-code/' },
        { label: 'Learn PyTorch', url: 'https://www.learnpytorch.io/' },
        { label: 'PyTorch 1H – Raschka', url: 'https://sebastianraschka.com/teaching/pytorch-1h/' }
      ]
    },
    {
      id: 't4',
      title: 'Natural Language Processing',
      cat: 'Advanced',
      desc: 'Make machines understand language.',
      resources: [
        { label: 'GFG – NLP Tutorial', url: 'https://www.geeksforgeeks.org/nlp/natural-language-processing-nlp-tutorial/' },
        { label: 'GFG – NLP Projects', url: 'https://www.geeksforgeeks.org/nlp/top-natural-language-processing-nlp-projects/' },
        { label: 'Hugging Face Course', url: 'https://huggingface.co/learn' }
      ]
    },
    {
      id: 't5',
      title: 'MLOps & MLflow',
      cat: 'Advanced',
      desc: 'Deploy, monitor, and scale models.',
      resources: [
        { label: 'IBM – MLOps Guide', url: 'https://www.ibm.com/think/topics/mlops' },
        { label: 'GFG – MLOps Intro', url: 'https://www.geeksforgeeks.org/machine-learning/what-is-mlops/' },
        { label: 'GFG – MLflow Tutorial', url: 'https://www.geeksforgeeks.org/machine-learning/machine-learning-with-mlflow/' },
        { label: 'MLflow Docs', url: 'https://mlflow.org/docs/latest/index.html' }
      ]
    },
    {
      id: 't6',
      title: 'Data Visualization',
      cat: 'Core',
      desc: 'Tell stories with data.',
      resources: [
        { label: 'IBM – Guide', url: 'https://www.ibm.com/think/topics/data-visualization' },
        { label: 'GFG – Visualization', url: 'https://www.geeksforgeeks.org/data-visualization/' },
        { label: 'Streamlit Docs', url: 'https://docs.streamlit.io/' }
      ]
    },
    {
      id: 't7',
      title: 'Python & SQL',
      cat: 'Foundation',
      desc: 'The backbone of data science.',
      resources: [
        { label: 'Real Python', url: 'https://realpython.com/' },
        { label: 'W3Schools SQL', url: 'https://www.w3schools.com/sql/' }
      ]
    }
  ];

  // Flatten all resources for the "All Links" tab
  const ALL_RESOURCES = TOPICS.flatMap(t => t.resources.map(r => ({ ...r, topic: t.title, topicId: t.id })));

  // ============================================================
  //  STATE MANAGEMENT
  // ============================================================
  function getChecked(prefix) {
    try { return JSON.parse(localStorage.getItem('mlhub_' + prefix)) || []; } catch(e) { return []; }
  }
  function setChecked(prefix, arr) {
    localStorage.setItem('mlhub_' + prefix, JSON.stringify(arr));
  }
  function toggleCheck(prefix, id) {
    let arr = getChecked(prefix);
    if (arr.includes(id)) arr = arr.filter(x => x !== id); else arr.push(id);
    setChecked(prefix, arr);
    return arr;
  }
  function isChecked(prefix, id) {
    return getChecked(prefix).includes(id);
  }

  // Streak
  function getStreak() { try { return parseInt(localStorage.getItem('mlhub_streak')) || 0; } catch(e) { return 0; } }
  function setStreak(v) { localStorage.setItem('mlhub_streak', v); }
  function getLastVisit() { return localStorage.getItem('mlhub_lastvisit') || ''; }
  function setLastVisit(v) { localStorage.setItem('mlhub_lastvisit', v); }
  function updateStreak() {
    const today = new Date().toDateString();
    const last = getLastVisit();
    let s = getStreak();
    if (last !== today) {
      const y = new Date(); y.setDate(y.getDate()-1);
      if (last === y.toDateString()) s += 1; else s = 1;
      setStreak(s); setLastVisit(today);
    }
    document.getElementById('streakDisplay').textContent = s;
    return s;
  }

  function getLevel(done, total) {
    const pct = total > 0 ? done/total : 0;
    if (pct < 0.2) return '🌱';
    if (pct < 0.4) return '📘';
    if (pct < 0.6) return '🚀';
    if (pct < 0.8) return '⚡';
    return '🏆';
  }

  function updateProgress() {
    const allIds = ALL_RESOURCES.map(r => r.url);
    const checked = getChecked('resource');
    const done = checked.filter(id => allIds.includes(id)).length;
    const total = allIds.length;
    document.getElementById('doneCount').textContent = done;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('mainProgress').style.width = (done/total*100) + '%';
    document.getElementById('levelBadge').textContent = getLevel(done, total);
    return { done, total };
  }

  // ============================================================
  //  CONFETTI
  // ============================================================
  function fireConfetti() {
    const container = document.getElementById('confettiBox');
    const colors = ['#e62429', '#f97316', '#fbbf24', '#22c55e', '#3b82f6', '#8b5cf6'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = (Math.random() * 5 + 3) + 'px';
      p.style.height = (Math.random() * 5 + 3) + 'px';
      p.style.animationDuration = (Math.random() * 1.5 + 0.8) + 's';
      p.style.animationDelay = (Math.random() * 0.3) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 2500);
    }
  }

  // ============================================================
  //  RENDER
  // ============================================================
  function renderTopics(filter = '') {
    const grid = document.getElementById('topicsGrid');
    const items = TOPICS.filter(t => t.title.toLowerCase().includes(filter) || t.desc.toLowerCase().includes(filter));
    grid.innerHTML = items.map(t => `
      <div class="card">
        <div class="badge-cat red">${t.cat}</div>
        <div class="title">${t.title}</div>
        <div class="desc">${t.desc}</div>
        <div class="resource-links">
          ${t.resources.map(r => `<a href="${r.url}" target="_blank">${r.label}</a>`).join('')}
        </div>
        <div class="actions">
          <div class="check-wrap">
            <input type="checkbox" class="resource-cb" data-url="${t.resources[0].url}" ${isChecked('resource', t.resources[0].url) ? 'checked' : ''} />
            <span>Read</span>
          </div>
        </div>
      </div>
    `).join('');
    attachCheckEvents();
  }

  function renderAllResources(filter = '') {
    const grid = document.getElementById('resourcesGrid');
    const items = ALL_RESOURCES.filter(r => r.label.toLowerCase().includes(filter) || r.topic.toLowerCase().includes(filter));
    grid.innerHTML = items.map(r => `
      <div class="card">
        <div class="badge-cat">${r.topic}</div>
        <div class="title">${r.label}</div>
        <div class="desc" style="font-size:0.6rem;color:#6b7280;">${r.url}</div>
        <div style="margin:0.3rem 0;">
          <a href="${r.url}" target="_blank" style="color:#60a5fa;font-size:0.7rem;text-decoration:none;background:rgba(255,255,255,0.04);padding:0.1rem 0.6rem;border-radius:40px;border:1px solid rgba(255,255,255,0.06);">Open Link</a>
        </div>
        <div class="actions">
          <div class="check-wrap">
            <input type="checkbox" class="resource-cb" data-url="${r.url}" ${isChecked('resource', r.url) ? 'checked' : ''} />
            <span>Read</span>
          </div>
        </div>
      </div>
    `).join('');
    attachCheckEvents();
  }

  function attachCheckEvents() {
    document.querySelectorAll('.resource-cb').forEach(cb => {
      cb.removeEventListener('change', handleCheck);
      cb.addEventListener('change', handleCheck);
    });
  }

  function handleCheck(e) {
    const url = this.dataset.url;
    toggleCheck('resource', url);
    updateProgress();
    fireConfetti();
  }

  function renderStats() {
    const grid = document.getElementById('statsGrid');
    const allIds = ALL_RESOURCES.map(r => r.url);
    const checked = getChecked('resource');
    const done = checked.filter(id => allIds.includes(id)).length;
    const total = allIds.length;
    const pct = total > 0 ? Math.round(done/total*100) : 0;
    grid.innerHTML = `
      <div class="stat-card"><div class="number">${done}</div><div class="label">Read</div></div>
      <div class="stat-card"><div class="number">${total}</div><div class="label">Total</div></div>
      <div class="stat-card"><div class="number">${pct}%</div><div class="label">Progress</div></div>
      <div class="stat-card"><div class="number">${getStreak()}</div><div class="label">Day Streak</div></div>
      <div class="stat-card"><div class="number">${TOPICS.length}</div><div class="label">Topics</div></div>
      <div class="stat-card"><div class="number">${ALL_RESOURCES.length}</div><div class="label">Resources</div></div>
    `;
    // Roadmap mini
    const roadmap = document.getElementById('roadmapMini');
    roadmap.innerHTML = TOPICS.map(t => `
      <span class="item"><i class="fas fa-check-circle" style="color:${isChecked('resource', t.resources[0]?.url) ? '#22c55e' : '#6b7280'}"></i> ${t.title}</span>
    `).join('');
  }

  // ============================================================
  //  TODAY'S PICK (date-based)
  // ============================================================
  function getTodaysPick() {
    const today = new Date().toDateString();
    let hash = 0;
    for (let i = 0; i < today.length; i++) { hash = ((hash << 5) - hash) + today.charCodeAt(i); hash |= 0; }
    const idx = Math.abs(hash) % ALL_RESOURCES.length;
    return ALL_RESOURCES[idx];
  }

  function updateTodayPick() {
    const pick = getTodaysPick();
    document.getElementById('todayTitle').textContent = pick.label;
    document.getElementById('todayDesc').textContent = `From topic: ${pick.topic}`;
    document.getElementById('todayLink').href = pick.url;
  }

  // ============================================================
  //  START BUTTON
  // ============================================================
  document.getElementById('startBtn').addEventListener('click', function() {
    const pick = getTodaysPick();
    window.open(pick.url, '_blank');
    fireConfetti();
    document.getElementById('todayTitle').textContent = '🕸️ You started!';
    document.getElementById('todayDesc').textContent = `Reading: ${pick.label}`;
  });

  // ============================================================
  //  SEARCH
  // ============================================================
  document.getElementById('searchInput').addEventListener('input', function() {
    const q = this.value.toLowerCase().trim();
    renderTopics(q);
    renderAllResources(q);
  });

  // ============================================================
  //  NOTEPAD
  // ============================================================
  const notepad = document.getElementById('notepadContent');
  notepad.value = localStorage.getItem('mlhub_notepad') || '';
  notepad.addEventListener('input', function() {
    localStorage.setItem('mlhub_notepad', this.value);
  });

  // ============================================================
  //  TABS
  // ============================================================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const panelId = 'panel-' + this.dataset.panel;
      document.getElementById(panelId).classList.add('active');
      if (this.dataset.panel === 'stats') renderStats();
    });
  });

  // ============================================================
  //  BOOT
  // ============================================================
  function init() {
    updateStreak();
    renderTopics();
    renderAllResources();
    renderStats();
    updateProgress();
    updateTodayPick();
  }
  init();
</script>
</body>
</html>
