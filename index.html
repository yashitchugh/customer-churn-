<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS·ML · Daily Learning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #e8edf5;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 1280px;
            width: 100%;
            background: #131e2f;
            border-radius: 32px;
            padding: 1.8rem 2rem 2.5rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-area i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .streak-box {
            background: #1e293b;
            padding: 0.2rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .streak-box i {
            color: #f59e0b;
        }
        .level-badge {
            background: #4f46e5;
            padding: 0.2rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }
        .progress-stats {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #1e293b;
            padding: 0.2rem 1rem;
            border-radius: 100px;
        }
        .progress-stats span {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .progress-bar-bg {
            width: 80px;
            height: 5px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #4f46e5);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* Big Start Button */
        .start-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }
        .start-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            padding: 0.9rem 2.8rem;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: pulse 2s infinite;
        }
        .start-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(79, 70, 229, 0.5);
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(79, 70, 229, 0.6);
            }
            100% {
                box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
            }
        }

        /* Today's Highlight */
        .today-highlight {
            background: #1a2639;
            border: 2px solid #4f46e5;
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .today-highlight .label {
            font-size: 0.8rem;
            color: #a5b4fc;
            font-weight: 600;
        }
        .today-highlight .title {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .today-highlight .desc {
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .today-highlight .link {
            background: #4f46e5;
            color: #fff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .today-highlight .link:hover {
            background: #6366f1;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 1.2rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: #64748b;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn:hover {
            color: #e2e8f0;
            background: #1e293b;
        }
        .tab-btn.active {
            background: #4f46e5;
            color: #fff;
        }

        .panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        /* Cards */
        .card {
            background: #1a2639;
            border: 1px solid #273548;
            border-radius: 16px;
            padding: 1.2rem;
            transition: 0.2s;
            cursor: default;
        }
        .card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
        }
        .card .badge-cat {
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            background: #273548;
            color: #94a3b8;
            display: inline-block;
            margin-bottom: 0.4rem;
        }
        .card .title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        .card .desc {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 0.6rem;
        }
        .card .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #273548;
            padding-top: 0.6rem;
            margin-top: 0.2rem;
        }
        .card .actions .check-wrap {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .card .actions .check-wrap input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4f46e5;
            cursor: pointer;
        }
        .card .actions .detail-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .card .actions .detail-btn:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
        }
        .video-link {
            display: inline-block;
            background: #1f2937;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #e2e8f0;
            text-decoration: none;
            border: 1px solid #334155;
            transition: 0.15s;
        }
        .video-link i {
            color: #ff0000;
            margin-right: 0.3rem;
        }
        .video-link:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
        }
        .video-link:hover i {
            color: #fff;
        }

        /* Roadmap (visual) */
        .roadmap-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1rem 0;
        }
        .roadmap-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .roadmap-node {
            background: #1a2639;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.2rem 1.8rem;
            flex: 1;
            min-width: 160px;
            text-align: center;
            transition: 0.2s;
        }
        .roadmap-node:hover {
            border-color: #818cf8;
        }
        .roadmap-node .node-icon {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            color: #818cf8;
        }
        .roadmap-node .node-title {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .roadmap-node .node-desc {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        .roadmap-arrow {
            color: #4f46e5;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        @media (max-width: 700px) {
            .roadmap-row {
                flex-direction: column;
                align-items: stretch;
            }
            .roadmap-arrow {
                transform: rotate(90deg);
                text-align: center;
            }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        .footer {
            margin-top: 2rem;
            border-top: 1px solid #1e293b;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #475569;
        }
        @media (max-width: 600px) {
            .app {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .start-btn {
                font-size: 1rem;
                padding: 0.7rem 1.8rem;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .today-highlight {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="logo-area">
                <i class="fas fa-brain"></i>
                <h1>DS·ML Engine</h1>
            </div>
            <div class="header-actions">
                <div class="streak-box"><i class="fas fa-fire"></i> <span id="streakDisplay">0</span>d</div>
                <div class="level-badge" id="levelBadge">🌱 Novice</div>
                <div class="progress-stats">
                    <span><strong id="doneCount">0</strong>/<span id="totalCount">0</span></span>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="mainProgress"></div></div>
                </div>
            </div>
        </header>

        <!-- BIG START BUTTON -->
        <div class="start-btn-wrap">
            <button class="start-btn" id="startBtn"><i class="fas fa-bolt"></i> Start Today's Win</button>
        </div>

        <!-- TODAY'S HIGHLIGHT -->
        <div class="today-highlight" id="todayHighlight">
            <div>
                <div class="label"><i class="fas fa-star"></i> Today's Pick</div>
                <div class="title" id="todayTitle">Loading...</div>
                <div class="desc" id="todayDesc">Hit "Start" to get a recommendation</div>
            </div>
            <a href="#" id="todayLink" class="link" target="_blank">Go <i class="fas fa-arrow-right"></i></a>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" data-panel="curriculum"><i class="fas fa-graduation-cap"></i> Topics</button>
            <button class="tab-btn" data-panel="youtube"><i class="fab fa-youtube"></i> Videos</button>
            <button class="tab-btn" data-panel="datasets"><i class="fas fa-database"></i> Datasets</button>
            <button class="tab-btn" data-panel="errors"><i class="fas fa-bug"></i> Errors</button>
            <button class="tab-btn" data-panel="roadmap"><i class="fas fa-map-signs"></i> Roadmap</button>
        </div>

        <!-- PANELS -->
        <div class="panel active" id="panel-curriculum"><div class="grid-2" id="theoryGrid"></div></div>
        <div class="panel" id="panel-youtube"><div class="grid-2" id="youtubeGrid"></div></div>
        <div class="panel" id="panel-datasets"><div class="grid-2" id="projectGrid"></div></div>
        <div class="panel" id="panel-errors"><div class="grid-2" id="errorGrid"></div></div>
        <div class="panel" id="panel-roadmap"><div class="roadmap-container" id="roadmapContainer"></div></div>

        <div class="footer">
            <span>⚡ Daily drive</span>
            <span><i class="fas fa-sync-alt"></i> Auto-saved</span>
        </div>
    </div>

    <!-- CONFETTI CONTAINER -->
    <div class="confetti-container" id="confettiBox"></div>

    <script>
        // ============================================================
        //  DATA – Full content, YT in learning order
        // ============================================================

        // Theory (10 topics)
        const THEORY_DATA = [
            { id: 't1', title: 'Python & Data Toolkit', cat: 'Foundation', desc: 'Pandas, NumPy, Matplotlib.' },
            { id: 't2', title: 'Statistics & Probability', cat: 'Foundation', desc: 'Distributions, hypothesis.' },
            { id: 't3', title: 'Classical Machine Learning', cat: 'Core', desc: 'Regression, trees, ensembles.' },
            { id: 't4', title: 'Time Series Analysis', cat: 'Core', desc: 'ARIMA, Prophet, LSTMs.' },
            { id: 't5', title: 'Data Visualization', cat: 'Core', desc: 'Dash, Streamlit, Tableau.' },
            { id: 't6', title: 'Deep Learning', cat: 'Advanced', desc: 'CNN, RNN, Transformers.' },
            { id: 't7', title: 'Natural Language Processing', cat: 'Advanced', desc: 'BERT, GPT, embeddings.' },
            { id: 't8', title: 'Generative AI & LLMs', cat: 'Advanced', desc: 'RAG, prompting, fine-tuning.' },
            { id: 't9', title: 'ML Pipelines & MLOps', cat: 'Advanced', desc: 'DVC, MLflow, monitoring.' },
            { id: 't10', title: 'Data Engineering', cat: 'Advanced', desc: 'SQL, ETL, Spark.' }
        ];

        // YouTube videos – ordered as a learning roadmap
        const YOUTUBE_DATA = [
            // Foundation
            { id: 'yt1', title: 'Neural Networks (3B1B)', cat: 'Foundation', video: 'https://www.youtube.com/watch?v=aircAruvnKk',
                channel: '3Blue1Brown' },
            { id: 'yt2', title: 'Python for Data Science (Harvard CS109)', cat: 'Foundation',
                video: 'https://www.youtube.com/watch?v=2T6-JH8f0kI', channel: 'Harvard' },
            // Core ML
            { id: 'yt3', title: 'Logistic Regression (StatQuest)', cat: 'Core',
                video: 'https://www.youtube.com/watch?v=yIYKR4sgzI8', channel: 'StatQuest' },
            { id: 'yt4', title: 'Feature Engineering (Kaggle)', cat: 'Core',
                video: 'https://www.youtube.com/watch?v=0Wgt6ofPbOc', channel: 'Kaggle' },
            { id: 'yt5', title: 'Time Series LSTM (Sentdex)', cat: 'Core',
                video: 'https://www.youtube.com/watch?v=ftMq5ps503w', channel: 'Sentdex' },
            { id: 'yt6', title: 'ML Full Course (freeCodeCamp)', cat: 'Core',
                video: 'https://www.youtube.com/watch?v=NWONeJKn6kc', channel: 'freeCodeCamp' },
            // Advanced DL/NLP
            { id: 'yt7', title: 'Transformers (3B1B)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=eMlx5fFNoYc',
                channel: '3Blue1Brown' },
            { id: 'yt8', title: 'GPT from Zero (Karpathy)', cat: 'Advanced',
                video: 'https://www.youtube.com/watch?v=kCc8FmEb1nY', channel: 'Andrej Karpathy' },
            { id: 'yt9', title: 'Attention is All You Need (Yannic Kilcher)', cat: 'Advanced',
                video: 'https://www.youtube.com/watch?v=iDulhoQ2pro', channel: 'Yannic Kilcher' },
            // GenAI & RAG
            { id: 'yt10', title: 'RAG in 10 min (LangChain)', cat: 'Advanced',
                video: 'https://www.youtube.com/watch?v=wd7TZ4w1mSw', channel: 'LangChain' },
            // MLOps & Deployment
            { id: 'yt11', title: 'MLOps Intro (Chip Huyen)', cat: 'Advanced',
                video: 'https://www.youtube.com/watch?v=06-AZXmwHjo', channel: 'Chip Huyen' },
            { id: 'yt12', title: 'End-to-End DS Project (Krish Naik)', cat: 'Hands-On',
                video: 'https://www.youtube.com/watch?v=7q4NpP1L9cE', channel: 'Krish Naik' }
        ];

        // Datasets (20) – reduced here for brevity, but you can expand
        const PROJECT_DATA = [
            { id: 'p1', title: 'Iris', cat: 'tabular', desc: 'Flower classification.' },
            { id: 'p2', title: 'Titanic', cat: 'tabular', desc: 'Survival prediction.' },
            { id: 'p3', title: 'MNIST', cat: 'vision', desc: 'Digit recognition.' },
            { id: 'p4', title: 'IMDB Reviews', cat: 'nlp', desc: 'Sentiment analysis.' },
            { id: 'p5', title: 'Stock Prices', cat: 'timeseries', desc: 'Forecast.' },
            { id: 'p6', title: 'Credit Card Fraud', cat: 'other', desc: 'Fraud detection.' },
            { id: 'p7', title: 'Fashion-MNIST', cat: 'vision', desc: 'Clothing classification.' },
            { id: 'p8', title: 'CIFAR-10', cat: 'vision', desc: 'Object recognition.' },
            { id: 'p9', title: 'Wine Quality', cat: 'tabular', desc: 'Quality prediction.' },
            { id: 'p10', title: 'Breast Cancer', cat: 'tabular', desc: 'Diagnostic binary classification.' },
            { id: 'p11', title: 'Spam/Ham', cat: 'nlp', desc: 'SMS classification.' },
            { id: 'p12', title: 'Twitter Sentiment', cat: 'nlp', desc: 'Real‑world sentiment.' },
            { id: 'p13', title: 'Air Quality', cat: 'timeseries', desc: 'PM2.5 forecasting.' },
            { id: 'p14', title: 'Customer Segmentation', cat: 'other', desc: 'Clustering.' },
            { id: 'p15', title: 'California Housing', cat: 'tabular', desc: 'House price prediction.' },
            { id: 'p16', title: 'Forest Cover Type', cat: 'tabular', desc: 'Cartographic classification.' },
            { id: 'p17', title: 'Human Activity Recognition', cat: 'timeseries', desc: 'Sensor data.' },
            { id: 'p18', title: 'COCO subset', cat: 'vision', desc: 'Object detection.' },
            { id: 'p19', title: 'KITTI', cat: 'vision', desc: 'Autonomous driving.' },
            { id: 'p20', title: 'Boston Housing', cat: 'tabular', desc: 'Median home value.' }
        ];

        // Errors
        const ERROR_DATA = [
            { id: 'e1', title: 'ValueError: shapes not aligned', severity: 'high',
                desc: 'Matrix dimensions mismatch for dot product.',
                fix: 'Use .shape to check dimensions. Ensure columns match rows.' },
            { id: 'e2', title: 'CUDA Out of Memory', severity: 'high', desc: 'GPU ran out of RAM.',
                fix: 'Reduce batch size or use gradient accumulation.' },
            { id: 'e3', title: 'ConvergenceWarning', severity: 'medium', desc: 'Model failed to converge.',
                fix: 'Increase max_iter or scale features.' },
            { id: 'e4', title: 'KeyError: column not found', severity: 'low', desc: 'Column name typo or missing.',
                fix: 'Print df.columns to see available names.' },
            { id: 'e5', title: 'AttributeError: module has no attribute', severity: 'medium',
                desc: 'Typo or deprecated function.', fix: 'Check library docs for updated names.' },
            { id: 'e6', title: 'MemoryError (RAM)', severity: 'high', desc: 'Dataset too large for RAM.',
                fix: 'Use chunksize or reduce dtype precision.' },
            { id: 'e7', title: 'UndefinedMetricWarning', severity: 'low', desc: 'F1 undefined due to no predictions.',
                fix: 'Add zero_division=0 in f1_score.' }
        ];

        // Roadmap (2026 skills)
        const ROADMAP_DATA = [
            { icon: 'fa-code', title: 'Python & SQL', desc: 'Foundation' },
            { icon: 'fa-chart-line', title: 'Classical ML', desc: 'Regression, Trees, Clustering' },
            { icon: 'fa-microchip', title: 'Deep Learning', desc: 'CNN, RNN, Transformers' },
            { icon: 'fa-robot', title: 'Generative AI & LLMs', desc: 'RAG, Prompting, Fine-tuning' },
            { icon: 'fa-gears', title: 'MLOps & Deployment', desc: 'Pipelines, Monitoring, Cloud' }
        ];

        // Combine all items for random picks
        const ALL_ITEMS = [...THEORY_DATA, ...YOUTUBE_DATA, ...PROJECT_DATA];

        // ============================================================
        //  STATE MANAGEMENT
        // ============================================================
        function getChecked(prefix) {
            try { return JSON.parse(localStorage.getItem('mlhub_' + prefix)) || []; } catch (e) { return []; }
        }

        function setChecked(prefix, arr) {
            localStorage.setItem('mlhub_' + prefix, JSON.stringify(arr));
        }

        function toggleCheck(prefix, id) {
            let arr = getChecked(prefix);
            if (arr.includes(id)) arr = arr.filter(x => x !== id);
            else arr.push(id);
            setChecked(prefix, arr);
            return arr;
        }

        function isChecked(prefix, id) {
            return getChecked(prefix).includes(id);
        }

        function getStreak() {
            try { return parseInt(localStorage.getItem('mlhub_streak')) || 0; } catch (e) { return 0; }
        }

        function setStreak(val) {
            localStorage.setItem('mlhub_streak', val);
        }

        function getLastVisit() {
            try { return localStorage.getItem('mlhub_lastvisit') || ''; } catch (e) { return ''; }
        }

        function setLastVisit(val) {
            localStorage.setItem('mlhub_lastvisit', val);
        }

        // Update streak daily
        function updateStreak() {
            const today = new Date().toDateString();
            const last = getLastVisit();
            let streak = getStreak();
            if (last !== today) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (last === yesterday.toDateString()) {
                    streak += 1;
                } else {
                    streak = 1;
                }
                setStreak(streak);
                setLastVisit(today);
            }
            document.getElementById('streakDisplay').textContent = streak;
            return streak;
        }

        // Level based on completion percentage
        function getLevel(done, total) {
            const pct = total > 0 ? done / total : 0;
            if (pct < 0.2) return { emoji: '🌱', name: 'Novice' };
            if (pct < 0.4) return { emoji: '📘', name: 'Learner' };
            if (pct < 0.6) return { emoji: '🚀', name: 'Explorer' };
            if (pct < 0.8) return { emoji: '⚡', name: 'Pro' };
            return { emoji: '🏆', name: 'Master' };
        }

        // ============================================================
        //  PROGRESS UPDATE
        // ============================================================
        function updateProgress() {
            const theoryDone = getChecked('theory').length;
            const ytDone = getChecked('youtube').length;
            const projDone = getChecked('project').length;
            const total = THEORY_DATA.length + YOUTUBE_DATA.length + PROJECT_DATA.length;
            const done = theoryDone + ytDone + projDone;
            document.getElementById('doneCount').textContent = done;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('mainProgress').style.width = (done / total * 100) + '%';
            const level = getLevel(done, total);
            document.getElementById('levelBadge').textContent = level.emoji + ' ' + level.name;
            return { done, total };
        }

        // ============================================================
        //  CONFETTI
        // ============================================================
        function fireConfetti() {
            const container = document.getElementById('confettiBox');
            const colors = ['#f59e0b', '#4f46e5', '#ef4444', '#22c55e', '#ec4899', '#06b6d4'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (Math.random() * 8 + 4) + 'px';
                piece.style.height = (Math.random() * 8 + 4) + 'px';
                piece.style.animationDuration = (Math.random() * 2 + 1) + 's';
                piece.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 3000);
            }
        }

        // ============================================================
        //  RENDER FUNCTIONS
        // ============================================================
        function renderTheory() {
            const grid = document.getElementById('theoryGrid');
            grid.innerHTML = THEORY_DATA.map(item => `
                <div class="card">
                    <div class="badge-cat">${item.cat}</div>
                    <div class="title">${item.title}</div>
                    <div class="desc">${item.desc}</div>
                    <div class="actions">
                        <div class="check-wrap">
                            <input type="checkbox" class="theory-cb" data-id="${item.id}" ${isChecked('theory', item.id) ? 'checked' : ''} />
                            <span>Done</span>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.theory-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    toggleCheck('theory', this.dataset.id);
                    updateProgress();
                    fireConfetti();
                });
            });
        }

        function renderYoutube() {
            const grid = document.getElementById('youtubeGrid');
            grid.innerHTML = YOUTUBE_DATA.map(item => `
                <div class="card">
                    <div class="badge-cat">${item.cat}</div>
                    <div class="title">${item.title}</div>
                    <div class="desc" style="font-size:0.7rem;color:#94a3b8;"><i class="fab fa-youtube"></i> ${item.channel}</div>
                    <div style="margin-bottom:0.5rem;">
                        <a href="${item.video}" target="_blank" class="video-link"><i class="fab fa-youtube"></i> Watch</a>
                    </div>
                    <div class="actions">
                        <div class="check-wrap">
                            <input type="checkbox" class="youtube-cb" data-id="${item.id}" ${isChecked('youtube', item.id) ? 'checked' : ''} />
                            <span>Watched</span>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.youtube-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    toggleCheck('youtube', this.dataset.id);
                    updateProgress();
                    fireConfetti();
                });
            });
        }

        function renderProjects() {
            const grid = document.getElementById('projectGrid');
            grid.innerHTML = PROJECT_DATA.map(item => `
                <div class="card">
                    <div class="badge-cat">${item.cat}</div>
                    <div class="title">${item.title}</div>
                    <div class="desc">${item.desc}</div>
                    <div class="actions">
                        <div class="check-wrap">
                            <input type="checkbox" class="project-cb" data-id="${item.id}" ${isChecked('project', item.id) ? 'checked' : ''} />
                            <span>Done</span>
                        </div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.project-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    toggleCheck('project', this.dataset.id);
                    updateProgress();
                    fireConfetti();
                });
            });
        }

        function renderErrors() {
            const grid = document.getElementById('errorGrid');
            grid.innerHTML = ERROR_DATA.map(item => `
                <div class="card">
                    <div class="badge-cat">${item.severity.toUpperCase()}</div>
                    <div class="title">${item.title}</div>
                    <div class="desc"><strong>Cause:</strong> ${item.desc}</div>
                    <div class="desc" style="color:#fde68a;"><strong>Fix:</strong> ${item.fix}</div>
                </div>
            `).join('');
        }

        function renderRoadmap() {
            const container = document.getElementById('roadmapContainer');
            let html = '';
            for (let i = 0; i < ROADMAP_DATA.length; i++) {
                const node = ROADMAP_DATA[i];
                html += `<div class="roadmap-node">
                            <div class="node-icon"><i class="fas ${node.icon}"></i></div>
                            <div class="node-title">${node.title}</div>
                            <div class="node-desc">${node.desc}</div>
                        </div>`;
                if (i < ROADMAP_DATA.length - 1) {
                    html += `<div class="roadmap-arrow"><i class="fas fa-arrow-right"></i></div>`;
                }
            }
            container.innerHTML = `<div class="roadmap-row">${html}</div>`;
        }

        // ============================================================
        //  TODAY'S PICK (date-based)
        // ============================================================
        function getTodaysPick() {
            const today = new Date().toDateString();
            // Use a hash of today's date to pick a deterministic index
            let hash = 0;
            for (let i = 0; i < today.length; i++) {
                hash = ((hash << 5) - hash) + today.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % ALL_ITEMS.length;
            return ALL_ITEMS[index];
        }

        function updateTodayPick() {
            const item = getTodaysPick();
            document.getElementById('todayTitle').textContent = item.title;
            document.getElementById('todayDesc').textContent = item.desc || (item.channel ? `From ${item.channel}` : '');
            let link = '#';
            if (item.video) link = item.video;
            else if (item.id && item.id.startsWith('t')) link = 'https://www.geeksforgeeks.org/';
            else link = '#';
            document.getElementById('todayLink').href = link;
        }

        // ============================================================
        //  START BUTTON
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            const item = getTodaysPick(); // Use the same daily pick
            if (item.video) {
                window.open(item.video, '_blank');
                fireConfetti();
                document.getElementById('todayTitle').textContent = "✅ You started!";
                document.getElementById('todayDesc').textContent = `Opened: ${item.title}`;
            } else {
                alert(`Today's focus: ${item.title}\nGo to the "${item.cat || 'general'}" section and dive in!`);
                fireConfetti();
            }
        });

        // ============================================================
        //  TABS
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + this.dataset.panel).classList.add('active');
            });
        });

        // ============================================================
        //  BOOT
        // ============================================================
        function init() {
            updateStreak();
            renderTheory();
            renderYoutube();
            renderProjects();
            renderErrors();
            renderRoadmap();
            updateProgress();
            updateTodayPick();
        }
        init();
    </script>
</body>
</html>
