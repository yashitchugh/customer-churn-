<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WebSlinger ML" />
  
  <!-- App Icon (Blue Chip Logo) -->
  <link rel="icon" type="image/png" sizes="512x512" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%230a0e1a'/><circle cx='256' cy='256' r='200' fill='none' stroke='%233b82f6' stroke-width='12'/><circle cx='256' cy='256' r='140' fill='none' stroke='%2360a5fa' stroke-width='8'/><circle cx='256' cy='256' r='80' fill='none' stroke='%2393bbfc' stroke-width='6'/><circle cx='256' cy='256' r='30' fill='%2360a5fa'/><line x1='256' y1='56' x2='256' y2='100' stroke='%233b82f6' stroke-width='6'/><line x1='256' y1='412' x2='256' y2='456' stroke='%233b82f6' stroke-width='6'/><line x1='56' y1='256' x2='100' y2='256' stroke='%233b82f6' stroke-width='6'/><line x1='412' y1='256' x2='456' y2='256' stroke='%233b82f6' stroke-width='6'/><line x1='116' y1='116' x2='148' y2='148' stroke='%233b82f6' stroke-width='6'/><line x1='364' y1='364' x2='396' y2='396' stroke='%233b82f6' stroke-width='6'/><line x1='116' y1='396' x2='148' y2='364' stroke='%233b82f6' stroke-width='6'/><line x1='364' y1='148' x2='396' y2='116' stroke='%233b82f6' stroke-width='6'/><circle cx='256' cy='256' r='180' fill='none' stroke='rgba(230,36,41,0.12)' stroke-width='1'/><circle cx='256' cy='256' r='120' fill='none' stroke='rgba(230,36,41,0.08)' stroke-width='1'/><line x1='76' y1='256' x2='436' y2='256' stroke='rgba(230,36,41,0.06)' stroke-width='1'/><line x1='256' y1='76' x2='256' y2='436' stroke='rgba(230,36,41,0.06)' stroke-width='1'/><line x1='128' y1='128' x2='384' y2='384' stroke='rgba(230,36,41,0.06)' stroke-width='1'/><line x1='128' y1='384' x2='384' y2='128' stroke='rgba(230,36,41,0.06)' stroke-width='1'/></svg>" />
  
  <title>🕸️ WebSlinger ML</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
    /* --- RESET --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #080c18;
      color: #e8edf5;
      min-height: 100vh;
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* --- Splash Screen --- */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0e1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .splash-screen.hidden { opacity: 0; }
    .splash-screen .splash-icon { width: 100px; height: 100px; animation: splashPulse 1.5s ease-in-out infinite; }
    .splash-screen .splash-icon svg { width: 100%; height: 100%; }
    .splash-screen .splash-title { font-size: 1.4rem; font-weight: 900; margin-top: 1rem; color: #f8fafc; }
    .splash-screen .splash-title span { color: #3b82f6; }
    .splash-screen .splash-sub { font-size: 0.75rem; color: #6b7280; margin-top: 0.2rem; }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }

    /* --- App Container --- */
    .app {
      max-width: 600px;
      width: 100%;
      background: rgba(10, 14, 26, 0.92);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 1.2rem 1.2rem 1.6rem;
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.06), inset 0 0 30px rgba(59, 130, 246, 0.03);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* --- Animated Web Background --- */
    .app::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
                  repeating-linear-gradient(45deg, rgba(59, 130, 246, 0.015) 0px, rgba(59, 130, 246, 0.015) 2px, transparent 2px, transparent 10px),
                  repeating-linear-gradient(-45deg, rgba(59, 130, 246, 0.015) 0px, rgba(59, 130, 246, 0.015) 2px, transparent 2px, transparent 10px);
      pointer-events: none;
      z-index: 0;
    }

    /* --- Swinging Spider --- */
    .spidey-swing {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 2rem;
      color: #3b82f6;
      animation: swingSpidey 4s ease-in-out infinite;
      z-index: 1;
      opacity: 0.6;
      filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3));
    }
    @keyframes swingSpidey {
      0% { transform: rotate(-15deg) translateY(0); }
      50% { transform: rotate(15deg) translateY(-8px); }
      100% { transform: rotate(-15deg) translateY(0); }
    }

    /* --- Header --- */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 2;
    }
    .logo { display: flex; align-items: center; gap: 0.5rem; }
    .logo svg { width: 36px; height: 36px; animation: glowPulse 2.2s infinite ease-in-out; }
    @keyframes glowPulse {
      0% { filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.3)); }
      50% { filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.7)) drop-shadow(0 0 50px rgba(230, 36, 41, 0.2)); }
      100% { filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.3)); }
    }
    .logo h1 { font-size: 1.3rem; font-weight: 900; background: linear-gradient(to right, #f8fafc, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo .badge { font-size: 0.5rem; background: #3b82f6; color: #fff; padding: 0.1rem 0.5rem; border-radius: 40px; -webkit-text-fill-color: #fff; font-weight: 700; }
    
    .header-actions { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .streak-box, .level-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.15rem 0.7rem;
      border-radius: 100px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #fbbf24;
    }
    .level-box { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .progress-stats {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.15rem 0.7rem;
      border-radius: 100px;
    }
    .progress-stats span { font-size: 0.6rem; color: #94a3b8; }
    .progress-stats strong { color: #f8fafc; }
    .progress-bar-bg { width: 60px; height: 4px; background: #1a1a2e; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #60a5fa, #e62429); border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

    /* --- Start Button --- */
    .start-wrap { display: flex; justify-content: center; margin-bottom: 1.2rem; position: relative; z-index: 2; }
    .start-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      justify-content: center;
    }
    .start-btn:hover { transform: translate3d(0, -3px, 0) scale3d(1.02, 1.02, 1); box-shadow: 0 0 50px rgba(59, 130, 246, 0.5); }
    .start-btn:active { transform: scale3d(0.97, 0.97, 1); }

    /* --- Today's Highlight --- */
    .today-highlight {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 16px;
      padding: 0.8rem 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      position: relative;
      z-index: 2;
      transition: border-color 0.3s, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .today-highlight:hover { border-color: rgba(59, 130, 246, 0.5); transform: translate3d(0, -2px, 0); }
    .today-highlight .label { font-size: 0.6rem; color: #60a5fa; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .today-highlight .title { font-weight: 700; font-size: 0.9rem; color: #f8fafc; }
    .today-highlight .desc { color: #94a3b8; font-size: 0.7rem; }
    .today-highlight .link {
      background: #3b82f6;
      color: #fff;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.7rem;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .today-highlight .link:hover { background: #60a5fa; transform: translate3d(3px, 0, 0); }

    /* --- Search --- */
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; position: relative; z-index: 2; }
    .search-box input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 0.5rem 1.1rem;
      color: #e8edf5;
      font-size: 0.8rem;
      outline: none;
      transition: all 0.3s;
    }
    .search-box input:focus { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
    .search-box input::placeholder { color: #6b7280; }

    /* --- Tabs --- */
    .tabs {
      display: flex;
      gap: 0.2rem;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 0.4rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 2;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.3rem 0.8rem;
      font-weight: 700;
      font-size: 0.65rem;
      color: #71717a;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .tab-btn:hover { color: #f4f4f5; background: rgba(255,255,255,0.06); }
    .tab-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }

    /* --- Panels --- */
    .panel { display: none; animation: springIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .panel.active { display: block; }
    @keyframes springIn {
      0% { opacity: 0; transform: translate3d(0, 20px, 0) scale3d(0.96, 0.96, 1); }
      70% { transform: translate3d(0, -2px, 0) scale3d(1.005, 1.005, 1); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
    }

    /* --- Cards --- */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; }
    .card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translate3d(0, -4px, 0); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .card .badge-cat {
      font-size: 0.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.1rem 0.5rem;
      border-radius: 40px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      display: inline-block;
      margin-bottom: 0.25rem;
    }
    .card .badge-cat.red { background: rgba(230, 36, 41, 0.15); color: #ef4444; }
    .card .title { font-weight: 700; font-size: 0.88rem; color: #f8fafc; margin-bottom: 0.15rem; }
    .card .desc { font-size: 0.7rem; color: #94a3b8; line-height: 1.35; margin-bottom: 0.45rem; }
    .card .resource-links { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.45rem; }
    .card .resource-links a {
      font-size: 0.6rem;
      color: #60a5fa;
      text-decoration: none;
      background: rgba(255,255,255,0.04);
      padding: 0.1rem 0.55rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.2s;
    }
    .card .resource-links a:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .card .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 0.45rem;
      margin-top: 0.2rem;
    }
    .card .actions .check-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.65rem;
      color: #94a3b8;
      cursor: pointer;
    }
    .card .actions .check-wrap input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* --- Roadmap --- */
    .roadmap-container { display: flex; flex-direction: column; gap: 0.8rem; padding: 0.3rem 0; }
    .roadmap-row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .roadmap-node {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      flex: 1;
      min-width: 120px;
      text-align: center;
      transition: all 0.3s;
    }
    .roadmap-node:hover { border-color: #3b82f6; transform: translate3d(0, -3px, 0); }
    .roadmap-node .node-icon { font-size: 1.3rem; color: #3b82f6; }
    .roadmap-node .node-title { font-weight: 700; font-size: 0.72rem; color: #f8fafc; }
    .roadmap-node .node-desc { font-size: 0.58rem; color: #94a3b8; }

    /* --- Stats --- */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin: 0.5rem 0; }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 0.85rem;
      text-align: center;
      transition: transform 0.3s;
    }
    .stat-card:hover { transform: translate3d(0, -4px, 0); border-color: rgba(59, 130, 246, 0.3); }
    .stat-card .number { font-size: 1.7rem; font-weight: 900; color: #3b82f6; }
    .stat-card .label { font-size: 0.6rem; color: #94a3b8; margin-top: 0.1rem; }

    /* --- Notepad --- */
    .notepad-area {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 0.85rem;
      margin-top: 0.5rem;
    }
    .notepad-area textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #e8edf5;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      resize: vertical;
      min-height: 110px;
      outline: none;
      padding: 0.2rem;
    }
    .notepad-area textarea::placeholder { color: #6b7280; }

    /* --- Shockwave Effect --- */
    .shockwave {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.6) 0%, rgba(59, 130, 246, 0.15) 40%, transparent 70%);
      transform: scale3d(0, 0, 1);
      animation: shockwavePulse 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      z-index: 99;
    }
    @keyframes shockwavePulse { 0% { transform: scale3d(0, 0, 1); opacity: 1; } 100% { transform: scale3d(4, 4, 1); opacity: 0; } }

    /* --- Footer --- */
    .footer {
      margin-top: 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 0.6rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 0.55rem;
      color: #4b5563;
    }
    .footer a { color: #3b82f6; text-decoration: none; }

    /* --- Responsive --- */
    @media (max-width: 450px) {
      .app { padding: 0.8rem; }
      .logo h1 { font-size: 1.1rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .tabs { gap: 0.1rem; }
      .tab-btn { padding: 0.2rem 0.6rem; font-size: 0.6rem; }
      .today-highlight { flex-direction: column; align-items: stretch; }
      .today-highlight .link { text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>

<!-- Splash Screen -->
<div class="splash-screen" id="splash">
  <div class="splash-icon">
    <svg viewBox="0 0 512 512">
      <rect width="512" height="512" rx="80" fill="#0a0e1a"/>
      <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="12"/>

  </div>
  <div class="splash-title">WebSlinger <span>ML</span></div>

<!-- Main App -->
<div class="app" id="app">
  
  <!-- Swinging Spider -->
  <div class="spidey-swing"><i class="fas fa-spider"></i></div>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 512 512">
        <rect width="512" height="512" rx="80" fill="#0a0e1a"/>
        <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="12"/>
        <circle cx="256" cy="256" r="140" fill="none" stroke="#60a5fa" stroke-width="8"/>
        <circle cx="256" cy="256" r="80" fill="none" stroke="#93bbfc" stroke-width="6"/>
        <circle cx="256" cy="256" r="30" fill="#60a5fa"/>
        <line x1="256" y1="56" x2="256" y2="100" stroke="#3b82f6" stroke-width="6"/>
        <line x1="256" y1="412" x2="256" y2="456" stroke="#3b82f6" stroke-width="6"/>
        <line x1="56" y1="256" x2="100" y2="256" stroke="#3b82f6" stroke-width="6"/>
        <line x1="412" y1="256" x2="456" y2="256" stroke="#3b82f6" stroke-width="6"/>
        <line x1="116" y1="116" x2="148" y2="148" stroke="#3b82f6" stroke-width="6"/>
        <line x1="364" y1="364" x2="396" y2="396" stroke="#3b82f6" stroke-width="6"/>
        <line x1="116" y1="396" x2="148" y2="364" stroke="#3b82f6" stroke-width="6"/>
        <line x1="364" y1="148" x2="396" y2="116" stroke="#3b82f6" stroke-width="6"/>
        <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(230,36,41,0.12)" stroke-width="1"/>
        <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(230,36,41,0.08)" stroke-width="1"/>
        <line x1="76" y1="256" x2="436" y2="256" stroke="rgba(230,36,41,0.06)" stroke-width="1"/>
        <line x1="256" y1="76" x2="256" y2="436" stroke="rgba(230,36,41,0.06)" stroke-width="1"/>
        <line x1="128" y1="128" x2="384" y2="384" stroke="rgba(230,36,41,0.06)" stroke-width="1"/>

      <div class="streak-box"><i class="fas fa-fire"></i> <span id="streakDisplay">0</span></div>

      <div class="progress-stats">
        <span><strong id="doneCount">0</strong>/<span id="totalCount">0</span></span>

  </header>

  <!-- Start Button -->
  <div class="start-wrap">
    <button class="start-btn" id="startBtn"><i class="fas fa-bolt"></i> Web Slinger – Start Today</button>
  </div>

  <!-- Today's Highlight -->
  <div class="today-highlight" id="todayHighlight">
    <div>
      <div class="label"><i class="fas fa-star"></i> Daily Web Pick</div>
      <div class="title" id="todayTitle">Loading...</div>
      <div class="desc" id="todayDesc">Tap the button to get a resource</div>
    </div>
    <a href="#" id="todayLink" class="link" target="_blank">Read <i class="fas fa-arrow-right"></i></a>
  </div>

  <!-- Search -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search topics, videos, datasets..." />
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-panel="topics"><i class="fas fa-graduation-cap"></i> Topics</button>
    <button class="tab-btn" data-panel="videos"><i class="fab fa-youtube"></i> Videos</button>
    <button class="tab-btn" data-panel="datasets"><i class="fas fa-database"></i> Datasets</button>
    <button class="tab-btn" data-panel="errors"><i class="fas fa-bug"></i> Errors</button>
    <button class="tab-btn" data-panel="roadmap"><i class="fas fa-map-signs"></i> Roadmap</button>
    <button class="tab-btn" data-panel="stats"><i class="fas fa-chart-pie"></i> Stats</button>
    <button class="tab-btn" data-panel="notepad"><i class="fas fa-pen"></i> Notes</button>
  </div>

  <!-- Panels -->
  <div class="panel active" id="panel-topics"><div class="grid-2" id="topicsGrid"></div></div>
  <div class="panel" id="panel-videos"><div class="grid-2" id="videosGrid"></div></div>
  <div class="panel" id="panel-datasets"><div class="grid-2" id="datasetsGrid"></div></div>
  <div class="panel" id="panel-errors"><div class="grid-2" id="errorsGrid"></div></div>
  <div class="panel" id="panel-roadmap"><div class="roadmap-container" id="roadmapContainer"></div></div>
  <div class="panel" id="panel-stats"><div class="stats-grid" id="statsGrid"></div></div>
  <div class="panel" id="panel-notepad">
    <div class="notepad-area">
      <textarea id="notepadContent" placeholder="📝 Jot down notes, code snippets, questions..."></textarea>
    </div>
  </div>

  <div class="footer">
    <span><i class="fas fa-spider"></i> With great power comes great ML</span>
    <span><i class="fas fa-sync-alt"></i> Auto-saved</span>
  </div>
</div>

<script>
  // ============================================================
  //  APPLICATION DATA (All links verified working)
  // ============================================================
  
  const TOPICS = [
    { id: 't1', title: 'Feature Engineering', cat: 'Core', desc: 'Turn raw data into model-ready features.', resources: [
      { label: 'GFG Guide', url: 'https://www.geeksforgeeks.org/machine-learning/what-is-feature-engineering/' },
      { label: 'TDS Techniques', url: 'https://towardsdatascience.com/feature-engineering-techniques-bab6cb39ed7e/' }
    ]},
    { id: 't2', title: 'Model Evaluation', cat: 'Core', desc: 'Know if your model actually works.', resources: [
      { label: 'GFG Metrics', url: 'https://www.geeksforgeeks.org/machine-learning/metrics-for-machine-learning-model/' },
      { label: 'GFG Evaluation', url: 'https://www.geeksforgeeks.org/machine-learning/machine-learning-model-evaluation/' }
    ]},
    { id: 't3', title: 'Deep Learning', cat: 'Advanced', desc: 'Neural networks for complex problems.', resources: [
      { label: 'Learn PyTorch', url: 'https://www.learnpytorch.io/' },
      { label: 'GFG DL', url: 'https://www.geeksforgeeks.org/deep-learning/deep-learning-tutorial/' }
    ]},
    { id: 't4', title: 'NLP & LLMs', cat: 'Advanced', desc: 'Make machines understand human text.', resources: [
      { label: 'Hugging Face', url: 'https://huggingface.co/learn' },
      { label: 'GFG NLP', url: 'https://www.geeksforgeeks.org/nlp/natural-language-processing-nlp-tutorial/' }
    ]},
    { id: 't5', title: 'MLOps & MLflow', cat: 'Advanced', desc: 'Deploy, monitor, and scale models.', resources: [
      { label: 'IBM MLOps', url: 'https://www.ibm.com/think/topics/mlops' },
      { label: 'GFG MLOps', url: 'https://www.geeksforgeeks.org/machine-learning/what-is-mlops/' },
      { label: 'MLflow Tutorial', url: 'https://www.geeksforgeeks.org/machine-learning/machine-learning-with-mlflow/' }
    ]},
    { id: 't6', title: 'Data Visualization', cat: 'Core', desc: 'Tell stories with data.', resources: [
      { label: 'IBM Guide', url: 'https://www.ibm.com/think/topics/data-visualization' },
      { label: 'GFG Viz', url: 'https://www.geeksforgeeks.org/data-visualization/' }
    ]},
    { id: 't7', title: 'Python & SQL', cat: 'Foundation', desc: 'The backbone of data science.', resources: [
      { label: 'Real Python', url: 'https://realpython.com/' },
      { label: 'W3Schools SQL', url: 'https://www.w3schools.com/sql/' }
    ]}
  ];

  const VIDEOS = [
    { id: 'v1', title: 'Python for Data Science (freeCodeCamp)', cat: 'Foundation', video: 'https://www.youtube.com/watch?v=LHBE6Q9XlzI', channel: 'freeCodeCamp' },
    { id: 'v2', title: 'SQL for Data Analytics (Alex The Analyst)', cat: 'Foundation', video: 'https://www.youtube.com/watch?v=7S_tz1z_5bA', channel: 'Alex The Analyst' },
    { id: 'v3', title: 'Logistic Regression (StatQuest)', cat: 'Core', video: 'https://www.youtube.com/watch?v=yIYKR4sgzI8', channel: 'StatQuest' },
    { id: 'v4', title: 'Decision Trees & Random Forest (StatQuest)', cat: 'Core', video: 'https://www.youtube.com/watch?v=7VeUPuFGJHk', channel: 'StatQuest' },
    { id: 'v5', title: 'XGBoost (StatQuest)', cat: 'Core', video: 'https://www.youtube.com/watch?v=ZVFeW798-2I', channel: 'StatQuest' },
    { id: 'v6', title: 'Neural Networks (3B1B)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=aircAruvnKk', channel: '3Blue1Brown' },
    { id: 'v7', title: 'CNNs (StatQuest)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=HGwBXDKFk9I', channel: 'StatQuest' },
    { id: 'v8', title: 'Transformers (3B1B)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=eMlx5fFNoYc', channel: '3Blue1Brown' },
    { id: 'v9', title: 'BERT (StatQuest)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=0MJRdVyQvRM', channel: 'StatQuest' },
    { id: 'v10', title: 'RAG in 10 min (LangChain)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=wd7TZ4w1mSw', channel: 'LangChain' },
    { id: 'v11', title: 'GPT (StatQuest)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=5vY2_5Gm_6g', channel: 'StatQuest' },
    { id: 'v12', title: 'MLOps (Chip Huyen)', cat: 'Advanced', video: 'https://www.youtube.com/watch?v=06-AZXmwHjo', channel: 'Chip Huyen' }
  ];

  const DATASETS = [
    { id: 'd1', title: 'Titanic', cat: 'Tabular', desc: 'Classic survival prediction starter.' },
    { id: 'd2', title: 'Iris', cat: 'Tabular', desc: '3-species flower classification.' },
    { id: 'd3', title: 'Boston Housing', cat: 'Tabular', desc: 'House price prediction.' },
    { id: 'd4', title: 'MNIST', cat: 'Vision', desc: 'Handwritten digit recognition.' },
    { id: 'd5', title: 'Fashion-MNIST', cat: 'Vision', desc: 'Clothing classification.' },
    { id: 'd6', title: 'CIFAR-10', cat: 'Vision', desc: 'Object recognition.' },
    { id: 'd7', title: 'IMDB Reviews', cat: 'NLP', desc: 'Sentiment analysis.' },
    { id: 'd8', title: 'Spam/Ham', cat: 'NLP', desc: 'SMS classification.' },
    { id: 'd9', title: 'Twitter Sentiment', cat: 'NLP', desc: 'Tweet sentiment.' },
    { id: 'd10', title: 'Stock Prices', cat: 'Time Series', desc: 'Price forecast.' },
    { id: 'd11', title: 'Air Quality', cat: 'Time Series', desc: 'PM2.5 forecasting.' },
    { id: 'd12', title: 'Credit Card Fraud', cat: 'Other', desc: 'Fraud detection.' },
    { id: 'd13', title: 'Customer Segmentation', cat: 'Other', desc: 'Clustering.' },
    { id: 'd14', title: 'COCO', cat: 'Vision', desc: 'Object detection.' },
    { id: 'd15', title: 'KITTI', cat: 'Vision', desc: 'Autonomous driving.' }
  ];

  const ERRORS = [
    { id: 'e1', title: 'KeyError: column not found', severity: 'Low', desc: 'Column typo or missing.', fix: 'Print df.columns. "With great power comes great responsibility – check your spelling!"' },
    { id: 'e2', title: 'ValueError: shapes not aligned', severity: 'High', desc: 'Matrix dimensions mismatch.', fix: 'Use .shape. "Your friendly neighborhood debugger – check dimensions!"' },
    { id: 'e3', title: 'CUDA Out of Memory', severity: 'High', desc: 'GPU ran out of RAM.', fix: 'Reduce batch size. "With great memory comes great responsibility – downsize!"' },
    { id: 'e4', title: 'MemoryError (RAM)', severity: 'High', desc: 'Dataset too large for RAM.', fix: 'Use chunksize. "Spidey senses tingling – use a smaller chunk!"' },
    { id: 'e5', title: 'ConvergenceWarning', severity: 'Medium', desc: 'Model failed to converge.', fix: 'Increase max_iter or scale features. "Persistence is key – keep iterating!"' },
    { id: 'e6', title: 'AttributeError: module has no attr', severity: 'Medium', desc: 'Typo or deprecated function.', fix: 'Check library docs. "Your spidey senses – check the docs!"' }
  ];

  const ROADMAP = [
    { icon: 'fa-code', title: 'Python & SQL', desc: 'Data wrangling' },
    { icon: 'fa-chart-bar', title: 'Stats & EDA', desc: 'Explore & understand' },
    { icon: 'fa-robot', title: 'Classical ML', desc: 'Regression, Trees, XGBoost' },
    { icon: 'fa-microchip', title: 'Deep Learning', desc: 'CNN, RNN, Transfer' },
    { icon: 'fa-language', title: 'NLP & LLMs', desc: 'BERT, RAG, Fine-tuning' },
    { icon: 'fa-gears', title: 'MLOps & Deploy', desc: 'Ship & monitor' }
  ];

  // All resources for daily pick
  const ALL_RESOURCES = [
    ...TOPICS.flatMap(t => t.resources.map(r => ({ ...r, topic: t.title }))),
    ...VIDEOS.map(v => ({ label: v.title, url: v.video, topic: v.cat }))
  ];

  // ============================================================
  //  STATE MANAGEMENT
  // ============================================================
  function getCompleted() {
    try { return JSON.parse(localStorage.getItem('spidey_completed')) || {}; } catch(e) { return {}; }
  }
  function setCompleted(c) { localStorage.setItem('spidey_completed', JSON.stringify(c)); }

  let completed = getCompleted();

  function toggleDone(id) {
    completed[id] = !completed[id];
    setCompleted(completed);
    renderAll();
    updateProgress();
    if (completed[id]) fireConfetti();
  }

  function isDone(id) { return !!completed[id]; }

  // ============================================================
  //  STREAK
  // ============================================================
  function getStreak() { try { return parseInt(localStorage.getItem('spidey_streak')) || 0; } catch(e) { return 0; } }
  function setStreak(v) { localStorage.setItem('spidey_streak', v); }
  function getLastVisit() { return localStorage.getItem('spidey_lastvisit') || ''; }
  function setLastVisit(v) { localStorage.setItem('spidey_lastvisit', v); }
  
  function updateStreak() {
    const today = new Date().toDateString();
    const last = getLastVisit();
    let s = getStreak();
    if (last !== today) {
      const y = new Date(); y.setDate(y.getDate()-1);
      if (last === y.toDateString()) s += 1; else s = 1;
      setStreak(s); setLastVisit(today);
    }
    document.getElementById('streakDisplay').textContent = s;
    return s;
  }

  // ============================================================
  //  PROGRESS
  // ============================================================
  function getLevel(done, total) {
    const pct = total > 0 ? done/total : 0;
    if (pct < 0.15) return '🌱 Novice';
    if (pct < 0.35) return '📘 Learner';
    if (pct < 0.55) return '🚀 Explorer';
    if (pct < 0.75) return '⚡ Pro';
    if (pct < 0.9) return '🦸 Hero';
    return '🏆 Master';
  }

  function updateProgress() {
    const allIds = [...TOPICS.map(t => t.id), ...VIDEOS.map(v => v.id), ...DATASETS.map(d => d.id)];
    const done = allIds.filter(id => completed[id]).length;
    const total = allIds.length;
    document.getElementById('doneCount').textContent = done;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('mainProgress').style.width = (done/total*100) + '%';
    document.getElementById('levelBadge').textContent = getLevel(done, total);
    return { done, total };
  }

  // ============================================================
  //  CONFETTI
  // ============================================================
  function fireConfetti() {
    const colors = ['#3b82f6', '#60a5fa', '#e62429', '#fbbf24', '#22c55e'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.style.cssText = `
        position: fixed;
        top: -10px;
        left: ${Math.random() * 100}%;
        width: ${Math.random() * 6 + 4}px;
        height: ${Math.random() * 6 + 4}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        border-radius: 2px;
        pointer-events: none;
        z-index: 9999;
        animation: confettiFall ${Math.random() * 1.5 + 1.2}s linear forwards;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
    if (!document.getElementById('confettiStyle')) {
      const style = document.createElement('style');
      style.id = 'confettiStyle';
      style.textContent = `
        @keyframes confettiFall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }
  }

  // ============================================================
  //  RENDER FUNCTIONS
  // ============================================================
  function renderTopics(filter = '') {
    const grid = document.getElementById('topicsGrid');
    const items = TOPICS.filter(t => t.title.toLowerCase().includes(filter) || t.desc.toLowerCase().includes(filter));
    grid.innerHTML = items.map(t => `
      <div class="card">
        <span class="badge-cat">${t.cat}</span>
        <div class="title">${t.title}</div>
        <div class="desc">${t.desc}</div>
        <div class="resource-links">${t.resources.map(r => `<a href="${r.url}" target="_blank">${r.label}</a>`).join('')}</div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${isDone(t.id) ? 'checked' : ''} onchange="toggleDone('${t.id}')"> Done
          </label>
        </div>
      </div>
    `).join('');
  }

  function renderVideos(filter = '') {
    const grid = document.getElementById('videosGrid');
    const items = VIDEOS.filter(v => v.title.toLowerCase().includes(filter) || v.channel.toLowerCase().includes(filter));
    grid.innerHTML = items.map(v => `
      <div class="card">
        <span class="badge-cat">${v.cat}</span>
        <div class="title">${v.title}</div>
        <div class="desc" style="color:#6b7280;font-size:0.65rem;"><i class="fab fa-youtube" style="color:#e62429;"></i> ${v.channel}</div>
        <div style="margin:0.3rem 0;"><a href="${v.video}" target="_blank" style="color:#60a5fa;font-size:0.7rem;text-decoration:none;background:rgba(255,255,255,0.05);padding:0.1rem 0.6rem;border-radius:40px;border:1px solid rgba(255,255,255,0.08);">Watch Video</a></div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${isDone(v.id) ? 'checked' : ''} onchange="toggleDone('${v.id}')"> Watched
          </label>
        </div>
      </div>
    `).join('');
  }

  function renderDatasets(filter = '') {
    const grid = document.getElementById('datasetsGrid');
    const items = DATASETS.filter(d => d.title.toLowerCase().includes(filter) || d.desc.toLowerCase().includes(filter));
    grid.innerHTML = items.map(d => `
      <div class="card">
        <span class="badge-cat">${d.cat}</span>
        <div class="title">${d.title}</div>
        <div class="desc">${d.desc}</div>
        <div class="actions">
          <label class="check-wrap">
            <input type="checkbox" ${isDone(d.id) ? 'checked' : ''} onchange="toggleDone('${d.id}')"> Explored
          </label>
        </div>
      </div>
    `).join('');
  }

  function renderErrors() {
    const grid = document.getElementById('errorsGrid');
    grid.innerHTML = ERRORS.map(e => `
      <div class="card">
        <span class="badge-cat ${e.severity === 'High' ? 'red' : ''}">${e.severity}</span>
        <div class="title">${e.title}</div>
        <div class="desc"><strong>Cause:</strong> ${e.desc}</div>
        <div class="desc" style="color:#fcd34d;"><strong>Fix:</strong> ${e.fix}</div>
      </div>
    `).join('');
  }

  function renderRoadmap() {
    const container = document.getElementById('roadmapContainer');
    container.innerHTML = ROADMAP.map(r => `
      <div class="roadmap-row">
        <div class="roadmap-node">
          <div class="node-icon"><i class="fas ${r.icon}"></i></div>
          <div class="node-title">${r.title}</div>
          <div class="node-desc">${r.desc}</div>
        </div>
      </div>
    `).join('');
  }

  function renderStats() {
    const grid = document.getElementById('statsGrid');
    const allIds = [...TOPICS.map(t => t.id), ...VIDEOS.map(v => v.id), ...DATASETS.map(d => d.id)];
    const done = allIds.filter(id => completed[id]).length;
    const total = allIds.length;
    const pct = total > 0 ? Math.round(done/total*100) : 0;
    grid.innerHTML = `
      <div class="stat-card"><div class="number">${done}</div><div class="label">Completed</div></div>
      <div class="stat-card"><div class="number">${total - done}</div><div class="label">Remaining</div></div>
      <div class="stat-card"><div class="number">${pct}%</div><div class="label">Progress</div></div>
      <div class="stat-card"><div class="number">${getStreak()}</div><div class="label">Day Streak</div></div>
      <div class="stat-card"><div class="number">${TOPICS.length}</div><div class="label">Topics</div></div>
      <div class="stat-card"><div class="number">${VIDEOS.length}</div><div class="label">Videos</div></div>
    `;
  }

  function renderAll() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    renderTopics(q);
    renderVideos(q);
    renderDatasets(q);
    renderErrors();
    renderRoadmap();
    renderStats();
  }

  // ============================================================
  //  TODAY'S PICK
  // ============================================================
  function getTodaysPick() {
    const today = new Date().toDateString();
    let hash = 0;
    for (let i = 0; i < today.length; i++) { hash = ((hash << 5) - hash) + today.charCodeAt(i); hash |= 0; }
    const idx = Math.abs(hash) % ALL_RESOURCES.length;
    return ALL_RESOURCES[idx];
  }

  function updateTodayPick() {
    const pick = getTodaysPick();
    document.getElementById('todayTitle').textContent = pick.label;
    document.getElementById('todayDesc').textContent = pick.topic ? `From: ${pick.topic}` : '';
    document.getElementById('todayLink').href = pick.url;
  }

  // ============================================================
  //  START BUTTON
  // ============================================================
  document.getElementById('startBtn').addEventListener('click', function() {
    const pick = getTodaysPick();
    window.open(pick.url, '_blank');
    fireConfetti();
    document.getElementById('todayTitle').textContent = '🕸️ You started!';
    document.getElementById('todayDesc').textContent = `Reading: ${pick.label}`;
  });

  // ============================================================
  //  SEARCH
  // ============================================================
  document.getElementById('searchInput').addEventListener('input', function() {
    renderAll();
  });

  // ============================================================
  //  NOTEPAD
  // ============================================================
  const notepad = document.getElementById('notepadContent');
  notepad.value = localStorage.getItem('spidey_notepad') || '';
  notepad.addEventListener('input', function() {
    localStorage.setItem('spidey_notepad', this.value);
  });

  // ============================================================
  //  TABS WITH SHOCKWAVE
  // ============================================================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      // Shockwave effect
      const rect = this.getBoundingClientRect();
      const shock = document.createElement('div');
      shock.className = 'shockwave';
      const size = Math.max(rect.width, rect.height) * 1.5;
      shock.style.width = shock.style.height = size + 'px';
      shock.style.left = (e.clientX - rect.left - size/2) + 'px';
      shock.style.top = (e.clientY - rect.top - size/2) + 'px';
      this.style.position = 'relative';
      this.style.overflow = 'hidden';
      this.appendChild(shock);
      setTimeout(() => shock.remove(), 800);

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + this.dataset.panel).classList.add('active');
      if (this.dataset.panel === 'stats') renderStats();
    });
  });

  // ============================================================
  //  SPLASH SCREEN
  // ============================================================
  window.addEventListener('load', function() {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hidden');
    }, 1200);
  });

  // ============================================================
  //  BOOT
  // ============================================================
  function init() {
    updateStreak();
    renderAll();
    updateProgress();
    updateTodayPick();
  }
  init();
</script>
</body>
</html>
