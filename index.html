<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>AI/DS · 2026 Learning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            color: #e8edf5;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 8px;
        }
        .app {
            max-width: 1280px;
            width: 100%;
            background: #131e2f;
            border-radius: 32px;
            padding: 1.8rem 2rem 2.5rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-area i {
            font-size: 2rem;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .progress-stats {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: #1e293b;
            padding: 0.3rem 1.2rem 0.3rem 1.5rem;
            border-radius: 100px;
        }
        .progress-stats span {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .progress-stats strong {
            color: #e2e8f0;
        }
        .progress-bar-bg {
            width: 100px;
            height: 6px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #818cf8, #4f46e5);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.6rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .tab-btn:hover {
            color: #e2e8f0;
            background: #1e293b;
        }
        .tab-btn.active {
            background: #4f46e5;
            color: #fff;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }

        /* Panels */
        .panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        /* Cards */
        .card {
            background: #1a2639;
            border: 1px solid #273548;
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.2s;
            cursor: default;
        }
        .card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        .card .badge-cat {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            background: #273548;
            color: #94a3b8;
            display: inline-block;
            margin-bottom: 0.6rem;
        }
        .card .title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .card .desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .card .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .card .links a {
            font-size: 0.7rem;
            font-weight: 600;
            text-decoration: none;
            background: #273548;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.1s;
        }
        .card .links a i {
            color: #818cf8;
        }
        .card .links a:hover {
            background: #334155;
            color: #fff;
        }
        .card .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #273548;
            padding-top: 0.8rem;
            margin-top: 0.2rem;
        }
        .card .actions .check-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .card .actions .check-wrap input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4f46e5;
            cursor: pointer;
        }
        .card .actions .detail-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .card .actions .detail-btn:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #fff;
        }

        /* Error Cards */
        .error-severity {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            margin-left: 0.5rem;
        }
        .sev-high {
            background: #b91c1c;
            color: #fecaca;
        }
        .sev-medium {
            background: #b45309;
            color: #fde68a;
        }
        .sev-low {
            background: #065f46;
            color: #a7f3d0;
        }

        /* Roadmap */
        .roadmap-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1rem 0;
        }
        .roadmap-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .roadmap-node {
            background: #1a2639;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.2rem 1.8rem;
            flex: 1;
            min-width: 160px;
            text-align: center;
            transition: 0.2s;
            position: relative;
        }
        .roadmap-node:hover {
            border-color: #818cf8;
        }
        .roadmap-node .node-icon {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            color: #818cf8;
        }
        .roadmap-node .node-title {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .roadmap-node .node-desc {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        .roadmap-arrow {
            color: #4f46e5;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        @media (max-width: 700px) {
            .roadmap-row {
                flex-direction: column;
                align-items: stretch;
            }
            .roadmap-arrow {
                transform: rotate(90deg);
                text-align: center;
            }
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1a2639;
            border: 1px solid #334155;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: fadeUp 0.25s ease;
            position: relative;
        }
        .modal-box .close-modal {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .modal-box .close-modal:hover {
            color: #fff;
        }
        .modal-box h2 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(to right, #f8fafc, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-box .modal-sub {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .modal-box .modal-body p,
        .modal-box .modal-body li {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .modal-box .modal-body ul {
            list-style: none;
            padding: 0;
        }
        .modal-box .modal-body ul li {
            padding: 0.4rem 0;
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 0.8rem;
            align-items: baseline;
        }
        .modal-box .modal-body ul li i {
            color: #818cf8;
            width: 18px;
        }
        .modal-box .modal-body .section-label {
            font-weight: 700;
            color: #e2e8f0;
            margin: 1rem 0 0.5rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal-box .modal-body .yt-link {
            display: inline-block;
            background: #4f46e5;
            color: #fff;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            transition: 0.2s;
        }
        .modal-box .modal-body .yt-link:hover {
            background: #6366f1;
        }

        .footer {
            margin-top: 2.5rem;
            border-top: 1px solid #1e293b;
            padding-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #475569;
        }

        @media (max-width: 600px) {
            .app {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .progress-stats {
                justify-content: space-between;
                width: 100%;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }
            .tab-btn {
                white-space: nowrap;
                padding: 0.4rem 1rem;
                font-size: 0.75rem;
            }
            .modal-box {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <header class="header">
            <div class="logo-area">
                <i class="fas fa-brain"></i>
                <h1>DS·ML 2026</h1>
            </div>
            <div class="header-actions">
                <div class="progress-stats">
                    <span><strong id="doneCount">0</strong> / <span id="totalCount">0</span></span>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="mainProgress"></div></div>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-panel="curriculum"><i class="fas fa-graduation-cap"></i> Curriculum</button>
            <button class="tab-btn" data-panel="youtube"><i class="fab fa-youtube"></i> YouTube</button>
            <button class="tab-btn" data-panel="datasets"><i class="fas fa-database"></i> Datasets</button>
            <button class="tab-btn" data-panel="errors"><i class="fas fa-bug"></i> Error Lab</button>
            <button class="tab-btn" data-panel="roadmap"><i class="fas fa-map-signs"></i> Roadmap</button>
        </div>

        <!-- PANEL 1: CURRICULUM -->
        <div class="panel active" id="panel-curriculum">
            <div class="grid-2" id="theoryGrid"></div>
        </div>

        <!-- PANEL 2: YOUTUBE -->
        <div class="panel" id="panel-youtube">
            <div style="margin-bottom:1.5rem;">
                <span style="background:#1e293b; padding:0.2rem 1.2rem; border-radius:40px; font-size:0.7rem; font-weight:600;"><i class="fas fa-star"></i> Top Channels</span>
                <span style="background:#1e293b; padding:0.2rem 1.2rem; border-radius:40px; font-size:0.7rem; font-weight:600; margin-left:0.5rem;"><i class="fas fa-list"></i> Best Playlists</span>
            </div>
            <div class="grid-2" id="youtubeGrid"></div>
        </div>

        <!-- PANEL 3: DATASETS -->
        <div class="panel" id="panel-datasets">
            <div class="grid-2" id="projectGrid"></div>
        </div>

        <!-- PANEL 4: ERROR LAB -->
        <div class="panel" id="panel-errors">
            <div class="grid-2" id="errorGrid"></div>
        </div>

        <!-- PANEL 5: ROADMAP -->
        <div class="panel" id="panel-roadmap">
            <div class="roadmap-container" id="roadmapContainer"></div>
        </div>

        <div class="footer">
            <span><i class="far fa-calendar-alt"></i> 2026 Market-Aligned</span>
            <span><i class="fas fa-sync-alt"></i> Auto-saved progress</span>
        </div>
    </div>

    <!-- COURSE DETAIL MODAL -->
    <div class="modal-overlay" id="courseModal">
        <div class="modal-box">
            <button class="close-modal" id="closeCourseModal">&times;</button>
            <h2 id="courseModalTitle">Course Title</h2>
            <div class="modal-sub" id="courseModalDesc">Description</div>
            <div class="modal-body" id="courseModalBody"></div>
        </div>
    </div>

    <!-- PROJECT DETAIL MODAL -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal-box">
            <button class="close-modal" id="closeProjectModal">&times;</button>
            <h2 id="projectModalTitle">Project</h2>
            <div class="modal-sub" id="projectModalDesc">Description</div>
            <div class="modal-body">
                <div class="section-label"><i class="fas fa-list-check"></i> Standard ML Pipeline</div>
                <ul id="projectModalSteps"></ul>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================

        // THEORY with detailed course info
        const THEORY_DATA = [{
            id: 't1',
            title: 'Python & Data Toolkit',
            cat: 'Foundation',
            desc: 'Pandas, NumPy, Matplotlib, Seaborn.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/python-programming-language/' }],
            course: {
                overview: 'Master the essential Python libraries for data manipulation, visualization, and numerical computing.',
                resources: ['Pandas Official Docs', 'NumPy Quickstart', 'Matplotlib Gallery'],
                videos: ['StatQuest: Pandas', 'Corey Schafer: NumPy'],
                project: 'Analyze a CSV dataset (e.g., sales data) using Pandas and create 5 insightful plots with Matplotlib/Seaborn.'
            }
        }, {
            id: 't2',
            title: 'Statistics & Probability',
            cat: 'Foundation',
            desc: 'Descriptive, distributions, hypothesis testing.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/statistics/' }],
            course: {
                overview: 'Understand the mathematical backbone of ML: mean, variance, distributions, p-values, and confidence intervals.',
                resources: ['Khan Academy Stats', 'StatQuest PDF'],
                videos: ['StatQuest: Statistics Fundamentals', '3Blue1Brown: Probability'],
                project: 'Perform A/B testing on a dummy dataset. Calculate p-values and draw conclusions.'
            }
        }, {
            id: 't3',
            title: 'Classical Machine Learning',
            cat: 'Core',
            desc: 'Regression, classification, clustering, ensembles.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/machine-learning/' }],
            course: {
                overview: 'Dive into Linear/Logistic Regression, Decision Trees, Random Forest, XGBoost, and K-Means.',
                resources: ['Scikit-learn docs', 'ML Cheatsheet'],
                videos: ['StatQuest: ML Playlist', 'Andrew Ng CS229'],
                project: 'Build a classification pipeline on the Titanic dataset. Compare Logistic Regression vs Random Forest.'
            }
        }, {
            id: 't4',
            title: 'Time Series Analysis',
            cat: 'Core',
            desc: 'ARIMA, SARIMA, Prophet, LSTMs.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/time-series-analysis/' }],
            course: {
                overview: 'Learn to handle date/time data, decompose trends/seasonality, and forecast using statistical and deep learning methods.',
                resources: ['Forecasting: Principles and Practice', 'Prophet docs'],
                videos: ['StatQuest: Time Series', 'Sentdex: LSTM Time Series'],
                project: 'Forecast the next 30 days of a stock price using ARIMA and an LSTM. Compare RMSE.'
            }
        }, {
            id: 't5',
            title: 'Deep Learning',
            cat: 'Advanced',
            desc: 'ANN, CNNs, RNNs, Transformers, Attention.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/deep-learning/' }],
            course: {
                overview: 'Neural networks from scratch: backpropagation, CNNs for images, RNNs for sequences, and the revolutionary Transformer architecture.',
                resources: ['Deep Learning Book (Goodfellow)', 'PyTorch Tutorials'],
                videos: ['3Blue1Brown: Neural Networks', 'Andrej Karpathy: Zero to Hero'],
                project: 'Train a CNN on CIFAR-10. Then swap the classifier head and fine-tune a pretrained ResNet.'
            }
        }, {
            id: 't6',
            title: 'Natural Language Processing',
            cat: 'Advanced',
            desc: 'Tokenization, embeddings, BERT, GPT.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/natural-language-processing-nlp/' }],
            course: {
                overview: 'Go from bag-of-words to state-of-the-art transformers. Understand attention, fine-tuning, and prompt engineering.',
                resources: ['Hugging Face Course', 'Speech and Language Processing'],
                videos: ['StatQuest: NLP', 'Andrej Karpathy: GPT from scratch'],
                project: 'Fine-tune a DistilBERT model on a custom text classification dataset (e.g., sentiment analysis on tweets).'
            }
        }, {
            id: 't7',
            title: 'Generative AI & LLMs',
            cat: 'Advanced',
            desc: 'Prompt engineering, RAG, fine-tuning.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/generative-ai/' }],
            course: {
                overview: 'Explore the world of GenAI: text generation, image synthesis (Diffusion), RAG for Q&A, and parameter-efficient fine-tuning (LoRA).',
                resources: ['OpenAI Cookbook', 'LangChain Docs'],
                videos: ['Andrej Karpathy: State of GPT', 'Stanford CS324'],
                project: 'Build a RAG pipeline using LangChain and a vector database (Chroma) to answer questions from your own PDF documents.'
            }
        }, {
            id: 't8',
            title: 'ML Pipelines & MLOps',
            cat: 'Advanced',
            desc: 'DVC, MLflow, Kubeflow, monitoring.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/mlops/' }],
            course: {
                overview: 'Bridge the gap between development and production. Learn versioning for data, model tracking, orchestration, and drift detection.',
                resources: ['MLOps Zoomcamp', 'DVC docs'],
                videos: ['DataTalksClub: MLOps', 'Chip Huyen: MLOps'],
                project: 'Set up MLflow to log parameters/metrics. Implement a simple CI/CD pipeline for a model using GitHub Actions.'
            }
        }, {
            id: 't9',
            title: 'Data Visualization',
            cat: 'Core',
            desc: 'Dash, Streamlit, Power BI, Tableau.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/data-visualization/' }],
            course: {
                overview: 'Transform raw data into compelling stories. Master static plots (Matplotlib/Seaborn) and interactive dashboards (Plotly/Streamlit).',
                resources: ['Plotly docs', 'Streamlit Gallery'],
                videos: ['Sentdex: Data Visualization', 'Streamlit Tutorial'],
                project: 'Build an interactive dashboard for the Iris dataset using Streamlit, allowing users to filter species and see scatter plots.'
            }
        }, {
            id: 't10',
            title: 'Data Engineering',
            cat: 'Advanced',
            desc: 'SQL, ETL, Spark, Kafka.',
            links: [{ label: 'GFG', url: 'https://www.geeksforgeeks.org/data-engineering/' }],
            course: {
                overview: 'Understand the backbone of data science: reliable data pipelines. Work with large-scale data processing using Spark and real-time streams with Kafka.',
                resources: ['Spark Documentation', 'Kafka Tutorial'],
                videos: ['Data Engineering 101', 'Spark Summit Talks'],
                project: 'Write a PySpark script to process a large log file, perform aggregations, and store the results in Parquet format.'
            }
        }];

        // PROJECTS (Datasets)
        const PROJECT_DATA = [{
            id: 'p1',
            title: 'Iris',
            cat: 'tabular',
            desc: 'Classic 3-species flower classification.',
            steps: [
                '1. Perform EDA: pairplots and correlation matrix.',
                '2. Train Logistic Regression, KNN, and Decision Tree.',
                '3. Evaluate using accuracy, confusion matrix, and F1-score.'
            ]
        }, {
            id: 'p2',
            title: 'Titanic',
            cat: 'tabular',
            desc: 'Predict survival with feature engineering.',
            steps: [
                '1. Handle missing values (Age, Cabin, Embarked).',
                '2. Create new features: Title, FamilySize, Deck.',
                '3. Compare Random Forest, XGBoost, and Logistic Regression.'
            ]
        }, {
            id: 'p3',
            title: 'Boston Housing',
            cat: 'tabular',
            desc: 'Median home value prediction.',
            steps: [

        function getChecked(prefix) {
            try { return JSON.parse(localStorage.getItem('mlhub_' + prefix)) || []; } catch (e) { return []; }
        }

        function setChecked(prefix, arr) {
            localStorage.setItem('mlhub_' + prefix, JSON.stringify(arr));
        }

        function toggleCheck(prefix, id) {
            let arr = getChecked(prefix);
            if (arr.includes(id)) arr = arr.filter(x => x !== id);
            else arr.push(id);
            setChecked(prefix, arr);
            return arr;
        }

        function isChecked(prefix, id) {
            return getChecked(prefix).includes(id);
        }

        function updateProgress() {
            const theoryDone = getChecked('theory').length;
            const projDone = getChecked('project').length;
            const ytDone = getChecked('youtube').length;
            const total = THEORY_DATA.length + PROJECT_DATA.length + YOUTUBE_DATA.length;
            const done = theoryDone + projDone + ytDone;
            document.getElementById('doneCount').textContent = done;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('mainProgress').style.width = (done / total * 100) + '%';
        }

                `<li><i class="fas fa-check-circle"></i> ${s.replace(/^\d+\.\s*/, '')}</li>`
            ).join('');
            projectModal.classList.add('open');
        }

        // ============================================================
        //  TABS
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel-' + this.dataset.panel).classList.add('active');
            });
        });

        // ============================================================
        //  BOOT
        // ============================================================
        renderTheory();
        renderProjects();
        renderErrors();
        renderYoutube();
        renderRoadmap();
        updateProgress();
    </script>
</body>
</html>
